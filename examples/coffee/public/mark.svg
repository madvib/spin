<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Basecamp Roastery">
  <!--
    The mark: a summit with a rising sun over it, drawn from the ramp so it
    is one object rather than a stack of shapes. `currentColor` lets the theme
    tint it and an inline `style` colour it for a one-off.
  -->
  <circle cx="32" cy="32" r="30" fill="var(--color-primary, #7c2d12)" />
  <path
    d="M8 46 L22 24 L31 39 L40 21 L56 46 Z"
    fill="var(--color-on-primary, #faf9f7)"
  />
  <circle cx="44" cy="16" r="6" fill="var(--color-on-primary, #faf9f7)" opacity="0.85" />
</svg>
