<scope>props={ label: string = "Drop files here", value: string = "", defaultValue: string = "", accept: string = "", multiple: bool = false, maxFiles: int = 0, maxSize: int = 0, minSize: int = 0, disabled: bool = false } consume={ fileUpload }</scope>

<div class="w-full" {...fileUpload.getRootProps()}>
  <div
    class="flex cursor-pointer flex-col items-center justify-center gap-1 rounded-lg border border-dashed border-border bg-surface px-4 py-6 text-center transition-colors duration-fast ease-decelerate data-[dragging]:border-primary data-[dragging]:bg-surface-raised data-[focus]:ring-2 data-[focus]:ring-border-strong data-[disabled]:cursor-not-allowed data-[disabled]:opacity-50"
    {...fileUpload.getDropzoneProps()}
  >
    <span class="i-lucide-upload text-lg text-muted" aria-hidden="true"></span>
    <span class="text-sm text-text" {...fileUpload.getLabelProps()}>{label}</span>
    <span class="text-xs text-muted">or click to browse</span>
  </div>

  <input {...fileUpload.getHiddenInputProps()} />

  <div class="mt-2 flex flex-col gap-1" {...fileUpload.getItemGroupProps()}>
    <template for={fileUpload.getAcceptedRows()} as={row} key={row.value}>
      <div class="flex items-center justify-between gap-2 rounded-md border border-border bg-surface-raised px-2 py-1.5" {...fileUpload.getItemProps(row)}>
        <span class="min-w-0 flex-1 truncate text-xs text-text" {...fileUpload.getItemNameProps(row)}>{row.value}</span>
        <span class="shrink-0 text-xs text-muted tabular-nums">{fileUpload.getItemSizeText(row)}</span>
        <button type="button" class="shrink-0 rounded-sm p-0.5 text-muted transition-colors duration-fast ease-decelerate hover:bg-surface hover:text-text" {...fileUpload.getItemDeleteTriggerProps(row)}>
          <span class="i-lucide-x text-xs" aria-hidden="true"></span>
        </button>
      </div>
    </template>
  </div>

  <div class="mt-1 flex justify-end">
    <button type="button" class="rounded-sm px-2 py-0.5 text-xs text-muted transition-colors duration-fast ease-decelerate hover:bg-surface hover:text-text" {...fileUpload.getClearTriggerProps()}>Clear</button>
  </div>
</div>
