<scope>props={ label: string = "", defaultChecked: bool = false, checked: bool, disabled: bool = false } consume={ switch_ }</scope>

<label class="flex items-center gap-2 cursor-pointer text-sm text-text" {...api.getRootProps()}>
  <span class="flex items-center justify-start px-1 w-8 h-4 rounded-full border border-border bg-surface shadow-sm transition-all data-[state=checked]:bg-text data-[state=checked]:border-transparent data-[state=checked]:justify-end" {...api.getControlProps()}>
    <span aria-hidden="true" class="block size-2 rounded-full bg-text-muted transition-transform" {...api.getThumbProps()}></span>
  </span>
  <span class="font-medium" {...api.getLabelProps()}>{label}</span>
  <input {...api.getHiddenInputProps()} />
</label>
