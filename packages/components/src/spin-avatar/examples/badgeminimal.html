<scope>props={ src: string = "https://i.pravatar.cc/300", label: string = "Avatar", fallback: string = "AB" } consume={ avatar }</scope>

<div class="mx-auto flex w-full max-w-xs justify-center">
  <div class="relative">
    <span class="relative grid h-16 w-16 shrink-0 place-items-center overflow-hidden rounded-2xl bg-surface-sunken text-lg font-semibold text-muted" {...avatar.getRootProps()}>
      <img class="h-full w-full object-cover data-[hidden]:hidden" draggable="false" {...avatar.getImageProps()} />
      <span aria-hidden="true" class="grid h-full w-full place-items-center data-[hidden]:hidden" {...avatar.getFallbackProps()}>{fallback}</span>
    </span>
    <span class="absolute -top-1 -right-1 grid h-6 w-6 place-items-center rounded-full border-2 border-solid border-surface bg-text text-xs font-bold text-surface">6</span>
  </div>
</div>
