<scope>props={ id: string = "tooltip", openDelay: int = 400, closeDelay: int = 150, interactive: bool = false, disabled: bool = false, defaultOpen: bool = false } consume={ tooltip }</scope>

<div>
  <button class="px-4 py-2 rounded-lg text-sm font-medium border border-border bg-surface-raised text-text shadow-sm transition-colors hover:bg-surface" {...tooltip.getTriggerProps()}>Hover me</button>
  <div {...tooltip.getPositionerProps()}>
    <div class="px-2 py-1 rounded-md text-xs bg-text text-surface shadow-md" {...tooltip.getContentProps()}>
      Tooltip content
    </div>
  </div>
</div>
