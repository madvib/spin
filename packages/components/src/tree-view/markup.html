<section>
  <p use:label>Repository</p>
  <ul use:tree>
    <template for={visible} as={row} key={row.node.value}>
      <li use:branch={row}>
        <button type="button" use:branch-control={row}>
          <span aria-hidden="true" use:branch-indicator={row}></span>
          <span use:branch-text={row}></span>
        </button>
        <ul use:branch-content={row}></ul>
      </li>
    </template>
  </ul>
  <p use:count></p>
</section>
