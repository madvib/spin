<scope>props={ label: string = "Steps", count: string = "", titles: string = "[]", linear: bool = false, orientation: string = "", defaultStep: string = "", step: string = "" } consume={ steps }</scope>

<div class="w-full" {...steps.getRootProps()}>
  <div class="mb-3 flex items-center justify-between gap-2">
    <span class="text-sm font-medium text-text">{label}</span>
    <span class="text-xs text-muted">Step {steps.value} of {steps.count}</span>
  </div>

  <ol class="flex items-start gap-1" {...steps.getListProps()}>
    <template for={steps.getItems()} as={row} key={row}>
      <li class="flex min-w-0 flex-1 items-center gap-1 last:flex-none" {...steps.getItemProps({ index: row })}>
        <button
          type="button"
          class="grid h-7 w-7 shrink-0 place-items-center rounded-full border border-border bg-surface-raised text-xs font-medium text-muted transition-all duration-fast ease-decelerate hover:border-primary data-[current]:border-primary data-[current]:bg-primary data-[current]:text-on-primary data-[complete]:border-primary data-[complete]:bg-primary data-[complete]:text-on-primary"
          {...steps.getTriggerProps({ index: row })}
        ><span aria-hidden="true" {...steps.getIndicatorProps({ index: row })}>{row}</span></button>
        <span class="hidden truncate text-xs text-muted data-[current]:text-text sm:block" {...steps.getSeparatorProps({ index: row })}>{steps.getItemTitle(row)}</span>
      </li>
    </template>
  </ol>

  <div
    class="mt-3 h-1.5 w-full overflow-hidden rounded-full bg-surface-sunken"
    {...steps.getProgressProps()}
  ><div class="h-full rounded-full bg-primary transition-all duration-fast ease-decelerate" style="width: var(--steps-progress, 0%)"></div></div>

  <div class="mt-3 hidden" {...steps.getContentProps({ index: steps.value })}>
    <p class="rounded-md border border-border bg-surface-raised p-3 text-sm text-text">{steps.getItemTitle(steps.value)}</p>
  </div>

  <div class="mt-3 flex items-center gap-2">
    <button
      type="button"
      class="rounded-md border border-border bg-surface-raised px-3 py-1.5 text-sm font-medium text-text transition-colors duration-fast ease-decelerate hover:bg-surface disabled:opacity-50"
      {...steps.getPrevTriggerProps()}
    >Back</button>
    <button
      type="button"
      class="rounded-md border border-transparent bg-primary px-3 py-1.5 text-sm font-medium text-on-primary transition-colors duration-fast ease-decelerate hover:opacity-90 disabled:opacity-50"
      {...steps.getNextTriggerProps()}
    >Next</button>
  </div>
</div>
