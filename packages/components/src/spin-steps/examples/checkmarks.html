<scope>props={ label: string = "Checkout", count: string = "4", titles: string = "["Cart","Shipping","Payment","Review"]", defaultStep: string = "2" } consume={ steps }</scope>

<div class="w-full" {...steps.getRootProps()}>
  <div class="mb-3 flex items-center justify-between gap-2">
    <span class="text-sm font-medium text-text">{label}</span>
    <span class="text-xs text-muted">Step {steps.value} of {steps.count}</span>
  </div>

  <ol class="flex items-start gap-1" {...steps.getListProps()}>
    <template for={steps.getItems()} as={row} key={row}>
      <li class="flex min-w-0 flex-1 items-center gap-1 last:flex-none" {...steps.getItemProps({ index: row })}>
        <button
          type="button"
          class="grid h-7 w-7 shrink-0 place-items-center rounded-full border border-solid border-border bg-surface-raised text-xs font-medium text-muted transition-all duration-fast ease-decelerate hover:border-primary data-[current]:border-primary data-[current]:bg-primary data-[current]:text-on-primary data-[complete]:border-primary data-[complete]:bg-primary data-[complete]:text-on-primary"
          {...steps.getTriggerProps({ index: row })}
        ><span class="i-lucide-check hidden data-[complete]:block"></span><span class="data-[complete]:hidden">{row}</span></button>
        <span class="hidden truncate text-xs text-muted data-[current]:text-text sm:block" {...steps.getSeparatorProps({ index: row })}>{steps.getItemTitle(row)}</span>
      </li>
    </template>
  </ol>
</div>
