<scope>props={ label: string = "Checkout", count: string = "3", titles: string = "["Account Setup","Profile Information","Verification"]", defaultStep: string = "1" } consume={ steps }</scope>

<div class="w-full" {...steps.getRootProps()}>
  <div class="mb-3 flex items-center justify-between gap-2">
    <span class="text-sm font-medium text-text">{label}</span>
    <span class="text-xs text-muted">Step {steps.value + 1} of {steps.count}</span>
  </div>

  <ol class="flex items-start gap-1" {...steps.getListProps()}>
    <template for={steps.getItems()} as={row} key={row}>
      <li class="relative flex min-w-0 items-center not-last:flex-1" {...steps.getItemProps({ index: row })}>
        <button
          class="flex shrink-0 items-center gap-3 rounded-md bg-transparent text-left"
          {...steps.getTriggerProps({ index: row })}
        ><span
            class="relative grid h-8 w-8 shrink-0 place-items-center rounded-full border-2 border-solid border-border bg-surface-raised text-sm font-semibold text-muted data-[current]:border-primary data-[current]:bg-primary data-[current]:text-on-primary data-[completed]:border-primary data-[completed]:bg-primary data-[completed]:text-on-primary"
            {...steps.getIndicatorProps({ index: row })}
          ><span aria-hidden="true" show={steps.getItemState({ index: row }).completed}><span class="i-lucide-check text-sm"></span></span><span aria-hidden="true" show={steps.getItemState({ index: row }).completed === false}>{row + 1}</span></span><span class="text-sm font-medium text-text">{steps.getItemTitle(row)}</span></button><span aria-hidden="true" class="mx-3 h-0.5 flex-1 bg-border data-[completed]:bg-primary" {...steps.getSeparatorProps({ index: row })}></span>
      </li>
    </template>
  </ol>

  <div class="mt-3 rounded-md border border-solid border-border bg-surface-raised p-3 text-sm text-text" {...steps.getContentProps({ index: steps.value })}>{steps.getItemTitle(steps.value)}</div>

  <div class="mt-3 flex items-center gap-2">
    <button class="rounded-md border border-solid border-border bg-surface-raised px-3 py-1.5 text-sm font-medium text-text transition-colors duration-fast ease-decelerate hover:bg-surface disabled:opacity-50" {...steps.getPrevTriggerProps()}>Back</button>
    <button class="rounded-md border border-solid border-transparent bg-primary px-3 py-1.5 text-sm font-medium text-on-primary transition-colors duration-fast ease-decelerate hover:opacity-90 disabled:opacity-50" {...steps.getNextTriggerProps()}>Next</button>
  </div>
</div>
