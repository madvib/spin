<scope>props={ label: string = "Checkout", count: string = "4", titles: string = "["Cart","Shipping","Payment","Review"]", defaultStep: string = "0", orientation: string = "vertical" } consume={ steps }</scope>

<div class="w-full" {...steps.getRootProps()}>
  <ol class="flex flex-col gap-4" {...steps.getListProps()}>
    <template for={steps.getItems()} as={row} key={row}>
      <li class="flex items-start gap-3" {...steps.getItemProps({ index: row })}>
        <button
          type="button"
          class="grid h-8 w-8 shrink-0 place-items-center rounded-full border border-solid border-border bg-surface-raised text-xs font-medium text-muted transition-all duration-fast ease-decelerate hover:border-primary data-[current]:border-primary data-[current]:bg-primary data-[current]:text-on-primary data-[complete]:border-primary data-[complete]:bg-primary data-[complete]:text-on-primary"
          {...steps.getTriggerProps({ index: row })}
        ><span class="i-lucide-check hidden data-[complete]:block"></span><span class="data-[complete]:hidden">{row}</span></button>
      </li>
    </template>
  </ol>

  <div class="mt-4 flex items-center gap-2">
    <button type="button" class="rounded-md border border-solid border-border bg-surface-raised px-3 py-1.5 text-sm font-medium text-text transition-colors duration-fast ease-decelerate hover:bg-surface disabled:opacity-50" {...steps.getPrevTriggerProps()}>Prev step</button>
    <button type="button" class="rounded-md border border-solid border-border bg-surface-raised px-3 py-1.5 text-sm font-medium text-text transition-colors duration-fast ease-decelerate hover:bg-surface disabled:opacity-50" {...steps.getNextTriggerProps()}>Next step</button>
  </div>
</div>
