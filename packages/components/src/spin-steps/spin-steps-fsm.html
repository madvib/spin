<scope>props={ count: int = 1, step: int = 0, defaultStep: int = 0, linear: bool = false, orientation: string = "horizontal", labels: string[] = [] } consume={ stepsFsm }</scope>

<div class="w-full" {...stepsFsm.getRootProps()}>
  <div
    class="flex items-center gap-2 data-[orientation=vertical]:mb-2 data-[orientation=vertical]:flex-col data-[orientation=vertical]:items-stretch data-[orientation=vertical]:gap-0"
    {...stepsFsm.getListProps()}
  >
    <template for={stepsFsm.getSteps()} as={step} key={step}>
      <div
        class="flex min-w-0 flex-1 items-center gap-2 data-[orientation=vertical]:flex-none"
        {...stepsFsm.getItemProps(step)}
      >
        <button
          class="flex min-w-0 items-center gap-2 rounded-md outline-none transition-colors duration-fast ease-decelerate focus-visible:ring-2 focus-visible:ring-border-strong data-[orientation=vertical]:w-full"
          {...stepsFsm.getTriggerProps(step)}
        >
          <span
            class="size-7 shrink-0 justify-center rounded-full border border-border bg-surface-raised text-xs font-medium text-muted tabular-nums shadow-sm transition-all duration-fast ease-decelerate data-[complete]:border-primary data-[complete]:bg-primary data-[complete]:text-on-primary data-[current]:border-primary data-[current]:text-text data-[current]:ring-2 data-[current]:ring-border-strong data-[incomplete]:opacity-60"
            {...stepsFsm.getIndicatorProps(step)}
          >{step + 1}</span>
          <span class="truncate text-sm text-muted transition-colors duration-fast ease-decelerate data-[complete]:text-text">{stepsFsm.getLabel(step)}</span>
        </button>
      </div>
      <span
        class="flex-1 border-t border-border transition-colors duration-fast ease-decelerate data-[complete]:border-primary data-[orientation=vertical]:hidden"
        {...stepsFsm.getSeparatorProps(step)}
      ></span>
      <span
        class="hidden ms-4 w-1 h-4 border-l border-border transition-colors duration-fast ease-decelerate data-[complete]:border-primary data-[orientation=vertical]:block"
        {...stepsFsm.getSeparatorProps(step)}
      ></span>
    </template>
  </div>

  <template for={stepsFsm.getSteps()} as={step} key={step}>
    <div
      class="mt-4 rounded-lg border border-border bg-surface-raised px-2 py-2 text-sm text-text shadow-sm transition-opacity duration-fast ease-decelerate data-[state=closed]:hidden"
      {...stepsFsm.getContentProps(step)}
    >
      <span class="font-medium">{stepsFsm.getLabel(step)}</span>
      <span class="text-muted"> — step {step + 1} of {stepsFsm.count}</span>
    </div>
  </template>

  <div class="mt-4 flex flex-wrap items-center gap-2">
    <button
      class="rounded-md border border-border bg-surface-raised px-2 py-1 text-xs font-medium text-text shadow-sm transition-colors duration-fast ease-decelerate hover:bg-surface data-[disabled]:opacity-50 data-[disabled]:cursor-not-allowed"
      {...stepsFsm.getPrevTriggerProps()}
    >Previous</button>
    <button
      class="rounded-md border border-border bg-surface-raised px-2 py-1 text-xs font-medium text-text shadow-sm transition-colors duration-fast ease-decelerate hover:bg-surface data-[disabled]:opacity-50 data-[disabled]:cursor-not-allowed"
      {...stepsFsm.getNextTriggerProps()}
    >Next</button>
    <button
      class="rounded-md border border-border bg-surface-raised px-2 py-1 text-xs font-medium text-muted shadow-sm transition-colors duration-fast ease-decelerate hover:bg-surface hover:text-text"
      {...stepsFsm.getResetTriggerProps()}
    >Reset</button>
    <div
      class="ms-auto h-1 w-16 overflow-hidden rounded-full border border-border bg-surface transition-all duration-slow ease-decelerate data-[orientation=vertical]:h-16 data-[orientation=vertical]:w-2"
      {...stepsFsm.getProgressProps()}
    >
      <div
        class="h-full bg-primary [width:var(--steps-percent,0%)] data-[orientation=vertical]:hidden"
      ></div>
      <div
        class="hidden bg-primary w-full data-[orientation=vertical]:block [height:var(--steps-percent,0%)]"
      ></div>
    </div>
  </div>
</div>
