<scope>props={ targetMs: string = "900000" } consume={ timer }</scope>

<div class="mx-auto w-full max-w-xs" {...timer.getRootProps()}>
  <div class="flex items-center gap-3" {...timer.getAreaProps()}>
    <div class="flex items-center gap-1 text-sm tabular-nums text-text">
      <template for={timer.getUnits()} as={unit} key={unit.type}>
        <div class="flex flex-col items-center" show={unit.type === "minutes" || unit.type === "seconds"} {...timer.getItemProps({ type: unit.type })}>
          <span class="min-w-[2ch] text-center" {...timer.getItemValueProps({ type: unit.type })}>{timer.formattedTime[unit.type]}</span>
        </div>
      </template>
    </div>
    <div class="flex items-center gap-1" {...timer.getControlProps()}>
    <button aria-label="Start" class="grid h-7 w-7 place-items-center rounded-md bg-semantic-success text-on-primary" {...timer.getActionTriggerProps({ action: "start" })}><span class="i-lucide-play text-xs"></span></button>
    <button aria-label="Pause" class="grid h-7 w-7 place-items-center rounded-md bg-surface-raised text-text" {...timer.getActionTriggerProps({ action: "pause" })}><span class="i-lucide-pause text-xs"></span></button>
  </div>
  </div>
</div>
