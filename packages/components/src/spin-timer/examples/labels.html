<scope>props={ targetMs: string = "5400000" } consume={ timer }</scope>

<div class="mx-auto w-full max-w-xs" {...timer.getRootProps()}>
  <div class="flex flex-col items-center gap-3" {...timer.getAreaProps()}>
    <span class="text-lg font-medium text-text">Study Session</span>
    <div class="flex items-start gap-4">
      <template for={timer.getUnits()} as={unit} key={unit.type}>
        <div class="flex flex-col items-center" {...timer.getItemProps({ type: unit.type })}>
          <span class="text-2xl tabular-nums text-text" {...timer.getItemValueProps({ type: unit.type })}>{timer.formattedTime[unit.type]}</span>
          <span class="text-xs text-muted" {...timer.getItemLabelProps({ type: unit.type })}>{unit.label}</span>
        </div>
      </template>
    </div>
    <div class="mt-3 flex items-center justify-center gap-2" {...timer.getControlProps()}>
    <button type="button" class="rounded-md border border-solid border-border bg-surface-raised px-3 py-1.5 text-sm" {...timer.getActionTriggerProps({ action: "start" })}>Start</button>
    <button type="button" class="rounded-md border border-solid border-border bg-surface-raised px-3 py-1.5 text-sm" {...timer.getActionTriggerProps({ action: "pause" })}>Pause</button>
    <button type="button" class="rounded-md border border-solid border-border bg-surface-raised px-3 py-1.5 text-sm" {...timer.getActionTriggerProps({ action: "reset" })}>Reset</button>
  </div>
  </div>
</div>
