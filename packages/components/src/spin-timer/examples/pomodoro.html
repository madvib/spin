<scope>props={ startMs: string = "1500000", countdown: bool = true } consume={ timer }</scope>

<div class="mx-auto w-full max-w-xs" {...timer.getRootProps()}>
  <div class="rounded-xl border-2 border-solid border-semantic-error bg-surface-raised p-4" {...timer.getAreaProps()}>
    <div class="mb-3 flex items-center justify-center gap-2"><span class="grid h-8 w-8 place-items-center rounded-full bg-semantic-error text-on-primary"><span class="i-lucide-coffee text-sm"></span></span><span class="font-semibold text-text">Focus Time</span></div>
    <div class="flex items-center justify-center text-4xl font-bold tabular-nums text-semantic-error">
      <template for={timer.getUnits()} as={unit} key={unit.type}>
        <div class="flex flex-col items-center" {...timer.getItemProps({ type: unit.type })}>
          <span class="min-w-[2ch] text-center" {...timer.getItemValueProps({ type: unit.type })}>{timer.formattedTime[unit.type]}</span>
        </div>
      </template>
    </div>
    <div class="mt-1 text-center text-xs text-muted">25 minutes of focused work</div>
    <div class="mt-3 flex items-center justify-center gap-2" {...timer.getControlProps()}>
    <button class="rounded-md border border-solid border-border bg-surface-raised px-3 py-1.5 text-sm" {...timer.getActionTriggerProps({ action: "start" })}>Start</button>
    <button class="rounded-md border border-solid border-border bg-surface-raised px-3 py-1.5 text-sm" {...timer.getActionTriggerProps({ action: "pause" })}>Pause</button>
    <button class="rounded-md border border-solid border-border bg-surface-raised px-3 py-1.5 text-sm" {...timer.getActionTriggerProps({ action: "reset" })}>Reset</button>
  </div>
  </div>
</div>
