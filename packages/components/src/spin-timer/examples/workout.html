<scope>props={ startMs: string = "30000", countdown: bool = true, autoStart: bool = true } consume={ timer }</scope>

<div class="mx-auto w-full max-w-xs" {...timer.getRootProps()}>
  <div class="rounded-lg bg-semantic-warning p-4 text-center text-on-primary" {...timer.getAreaProps()}>
    <div class="mb-3 flex items-center justify-center gap-2"><span class="i-lucide-dumbbell text-lg"></span><span class="text-lg font-bold">Rest Time</span></div>
    <div class="text-5xl font-bold tabular-nums">
      <template for={timer.getUnits()} as={unit} key={unit.type}>
        <div class="flex flex-col items-center" show={unit.type === "seconds"} {...timer.getItemProps({ type: unit.type })}>
          <span class="min-w-[2ch] text-center" {...timer.getItemValueProps({ type: unit.type })}>{timer.formattedTime[unit.type]}</span>
        </div>
      </template>
    </div>
    <div class="mt-1 text-sm opacity-80">seconds</div>
  </div>
</div>
