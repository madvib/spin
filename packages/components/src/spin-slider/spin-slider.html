<scope>props={ label: string = "", defaultValue: int = 50, min: int = 0, max: int = 100, step: int = 1, disabled: bool = false, name: string = "" } consume={ slider }</scope>

<div {...slider.getRootProps()}>
  <div class="flex items-center justify-between">
    <label class="text-sm font-medium text-text" {...slider.getLabelProps()}>{label}</label>
    <span class="text-sm text-muted" {...slider.getValueTextProps()}></span>
  </div>
  <div class="mt-2 mb-2 relative flex items-center py-1" {...slider.getControlProps()}>
    <div class="h-1 w-full rounded-full bg-surface border border-border" {...slider.getTrackProps()}>
      <div class="h-full rounded-full bg-text" {...slider.getRangeProps()}></div>
    </div>
    <div class="absolute size-4 rounded-full bg-surface-raised border border-border shadow-sm" {...slider.getThumbProps({ index: 0 })}></div>
  </div>
  <input {...slider.getHiddenInputProps({ index: 0 })} />
</div>
