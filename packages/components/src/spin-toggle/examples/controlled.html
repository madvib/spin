<scope>props={ label: string = "Mute", pressed: bool = false } consume={ toggle }</scope>

<div class="mx-auto flex w-full max-w-md flex-col items-center gap-4">
  <button
    class="inline-flex items-center justify-center gap-2 rounded-md border border-solid border-border bg-surface text-text transition-all hover:bg-surface-raised data-[state=on]:border-primary data-[state=on]:bg-primary data-[state=on]:text-on-primary data-[disabled]:cursor-not-allowed data-[disabled]:opacity-50"
    {...toggle.getRootProps()}
  ><span class="text-base" aria-hidden="true"><span class="i-lucide-volume" show={!toggle.pressed}></span><span class="i-lucide-volume-x" show={toggle.pressed}></span></span><span class="px-4 py-2 text-sm font-medium" show={!toggle.pressed}>Unmuted</span><span class="px-4 py-2 text-sm font-medium" show={toggle.pressed}>Muted</span></button>
  <p class="text-sm text-muted" id="tg-status">Volume is unmuted</p>
  <button id="tg-external">Toggle Externally</button>
</div>
