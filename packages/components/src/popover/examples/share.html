<scope>props={ label: string = "Share" } consume={ popover }</scope>

<button {...popover.getTriggerProps()}
  class="inline-flex items-center gap-2 secondary s-sm transition-colors hover:bg-surface">
  <span class="i-lucide-share text-sm" aria-hidden="true"></span>
  Share
</button>

<popover {...popover.getContentProps()}
  class="max-w-[20rem]">
  <p class="text-sm font-medium text-text">Share this page</p>
  <p
    class="mt-1 text-sm text-text-muted">Copy the link below to send it to a friend.</p>
</popover>
