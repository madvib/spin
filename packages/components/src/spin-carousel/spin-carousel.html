<scope>props={ items: { value: string, label: string, content: string }[] = [], defaultPage: int = 0, loop: bool = false } consume={ carousel }</scope>

<div class="rounded-lg border border-border bg-surface-raised p-4" {...api.getRootProps()}>
  <div class="overflow-x-auto rounded-md snap-x snap-mandatory" {...api.getItemGroupProps()}>
    <div class="flex">
      <template for={items} as={row} key={row.value}>
        <div class="p-4 text-center flex-none w-full snap-center" {...api.getItemProps({ index: i })}>
          <div class="text-md font-medium text-text">{row.label}</div>
          <div class="text-sm text-muted mt-1">{row.content}</div>
        </div>
      </template>
    </div>
  </div>
  <div class="flex items-center justify-between mt-2">
    <button type="button" class="rounded-lg border border-border bg-surface-raised px-4 py-2 text-sm font-medium text-text shadow-sm transition-colors hover:bg-surface" {...api.getPrevTriggerProps()}>‹ Prev</button>
    <div class="flex gap-2" {...api.getIndicatorGroupProps()}>
      <template for={items} as={row} key={row.value}>
        <button type="button" class="rounded-full border border-border bg-surface text-muted transition-colors data-[current]:bg-text data-[current]:text-surface data-[current]:border-transparent" {...api.getIndicatorProps({ index: i })}>•</button>
      </template>
    </div>
    <button type="button" class="rounded-lg border border-border bg-surface-raised px-4 py-2 text-sm font-medium text-text shadow-sm transition-colors hover:bg-surface" {...api.getNextTriggerProps()}>Next ›</button>
  </div>
</div>
