<scope>props={ label: string = "Play", tip: string = "Product Demo" } consume={ tooltip }</scope>

<button {...tooltip.getTriggerProps()}

  <span class="i-lucide-play text-2xl text-text" aria-hidden="true"></span>
</button>

<tooltip {...tooltip.getContentProps()}
  class="fixed max-w-[16rem] data-[placement=top]:origin-bottom-left data-[placement=bottom]:origin-top-left">
  <div class="stack-xs">
    <p class="text-xs font-medium text-text">Product Demo</p>

      class="text-xs text-muted">Learn platform features in this walkthrough.</p>
    <div class="flex items-center gap-2 text-xs text-muted">
      <span>4:32</span><span>•</span><span>720p</span><span>•</span><span>2.1M</span>
    </div>
  </div>
