<scope>props={ label: string = "System Status", tip: string = "Operational" } consume={ tooltip }</scope>

<button {...tooltip.getTriggerProps()}
  class="secondary s-sm inline-flex items-center gap-2">
  <span class="i-lucide-activity text-sm" aria-hidden="true"></span>
  {label}
</button>

<tooltip {...tooltip.getContentProps()}
  class="fixed max-w-[16rem] data-[placement=top]:origin-bottom-left data-[placement=bottom]:origin-top-left">
  <div class="stack-xs">
    <div>
      <div class="text-xs text-muted">Status</div>
      <div class="text-xs font-semibold">Operational</div>
    </div>
    <div>
      <div class="text-xs text-muted">Uptime</div>
      <div class="text-xs font-semibold">99.9%</div>
    </div>
    <div>
      <div class="text-xs text-muted">Deploy</div>
      <div class="text-xs font-semibold">2h ago</div>
    </div>
    <div>
      <div class="text-xs text-muted">Response</div>
      <div class="text-xs font-semibold">145ms</div>
    </div>
  </div>
</tooltip>
