<script lang="ts">
import { menu } from "../menu.presentation.ts";

const machine = menu({

    "label": "Open…",
    "shortcut": "Ctrl+O",
  }, { "value": "promote", "label": "Promote to production", "shortcut": "Ctrl+S" }],
});
