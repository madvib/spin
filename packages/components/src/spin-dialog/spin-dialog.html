<scope>props={ modal: bool = true, trapFocus: bool = true, preventScroll: bool = true, closeOnEscape: bool = true, closeOnInteractOutside: bool = true, restoreFocus: bool = true, role: string = "dialog", defaultOpen: bool = false, open: bool = false } consume={ dialog }</scope>

<button {...dialog.getTriggerProps()} class="px-4 py-2 rounded-lg border border-border bg-surface-raised text-text text-sm font-medium shadow-sm transition-colors hover:bg-surface">Open dialog</button>

<div {...dialog.getBackdropProps()} class="fixed inset-0 bg-text opacity-50"></div>

<div {...dialog.getPositionerProps()} class="fixed inset-0 flex items-center justify-center pointer-events-none">
  <div {...dialog.getContentProps()} class="pointer-events-auto bg-surface-raised rounded-lg border border-border shadow-lg p-4 max-w-md relative">
    <h2 {...dialog.getTitleProps()} class="text-lg font-semibold text-text pr-8">Dialog title</h2>
    <p {...dialog.getDescriptionProps()} class="text-sm text-muted mt-1">Dialog description</p>
    <button {...dialog.getCloseTriggerProps()} class="absolute top-2 right-2 p-1 rounded-md text-xl text-muted bg-transparent border-transparent transition-colors hover:text-text hover:bg-surface">×</button>
  </div>
</div>
