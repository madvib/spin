<scope>props={modal: bool = true, trapFocus: bool = true, preventScroll: bool = true, closeOnEscape: bool = true, closeOnInteractOutside: bool = true, restoreFocus: bool = true, role: string = "dialog", defaultOpen: bool = false} consume={dialog}</scope>

<button {...api.getTriggerProps()} class="px-4 py-2 rounded-md border border-border bg-surface-raised text-text text-sm font-medium transition-colors">Open dialog</button>

<div {...api.getBackdropProps()} class="fixed inset-0 bg-text opacity-50"></div>

<div {...api.getPositionerProps()} class="fixed inset-0 flex items-center justify-center">
  <div {...api.getContentProps()} class="bg-surface rounded-lg border border-border shadow-lg p-4 max-w-md relative">
    <h2 {...api.getTitleProps()} class="text-lg font-semibold pr-8">Dialog title</h2>
    <p {...api.getDescriptionProps()} class="text-sm text-muted mt-2">Dialog description</p>
    <button {...api.getCloseTriggerProps()} class="absolute top-2 right-2 p-1 text-xl text-muted bg-transparent border-transparent shadow-none transition-colors hover:text-text">×</button>
  </div>
</div>
