<scope>props={ label: string = "Hover me" } consume={ hoverCard }</scope>

<div {...hoverCard.getRootProps()} class="inline-block">
  <span {...hoverCard.getTriggerProps()}
    class="inline-block cursor-pointer rounded-md border border-solid border-border bg-surface-raised px-3 py-1 text-sm text-text transition-colors hover:bg-surface">{label}</span>

  <div {...hoverCard.getContentProps()}
    class="fixed m-0 rounded-lg border border-solid border-border bg-surface-raised p-4 shadow-lg max-w-[20rem] data-[placement=top]:origin-bottom-left data-[placement=bottom]:origin-top-left">
    <div class="stack-sm">
      <h3 class="text-sm text-text">Hover Card</h3>
      <p
        class="text-sm text-text-muted">This is a basic hover card that appears when you hover over the trigger element.</p>
    </div>
  </div>
</div>
