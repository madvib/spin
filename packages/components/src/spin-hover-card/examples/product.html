<scope>props={ label: string = "Product", name: string = "Premium Wireless Headphones", price: string = "$299" } consume={ hoverCard }</scope>

<div {...hoverCard.getRootProps()} class="inline-block">
  <div {...hoverCard.getTriggerProps()} class="grid h-32 w-32 place-items-center overflow-hidden rounded-lg border border-solid border-border bg-surface-sunken">
    <span class="i-lucide-headphones text-2xl text-text" aria-hidden="true"></span>
  </div>

  <div {...hoverCard.getContentProps()} class="fixed m-0 rounded-lg border border-solid border-border bg-surface-raised p-4 shadow-lg max-w-[20rem] [left:var(--anchor-x,0px)] [top:var(--anchor-y,100%)] [min-width:var(--anchor-w,auto)] data-[placement=top]:origin-bottom-left data-[placement=bottom]:origin-top-left">
    <p class="m-0 text-sm font-medium text-text">{name}</p>
    <p class="m-0 mt-1 text-sm text-muted">{price}</p>
  </div>
</div>
