<scope>props={ label: string = "User", name: string = "John Doe", handle: string = "@johndoe" } consume={ hoverCard }</scope>

<div {...hoverCard.getRootProps()} class="inline-block">
  <button {...hoverCard.getTriggerProps()} class="inline-flex items-center gap-2 rounded-lg border border-solid border-border bg-surface-raised px-3 py-1.5 text-sm font-medium text-text shadow-sm transition-colors hover:bg-surface">
    <span class="i-lucide-user text-sm" aria-hidden="true"></span>
    {handle}
  </button>

  <div {...hoverCard.getContentProps()} class="fixed m-0 rounded-lg border border-solid border-border bg-surface-raised p-4 shadow-lg max-w-[20rem] [left:var(--anchor-x,0px)] [top:var(--anchor-y,100%)] [min-width:var(--anchor-w,auto)] data-[placement=top]:origin-bottom-left data-[placement=bottom]:origin-top-left">
    <p class="m-0 text-sm font-medium text-text">{name}</p>
    <p class="m-0 mt-1 text-sm text-muted">{handle}</p>
  </div>
</div>
