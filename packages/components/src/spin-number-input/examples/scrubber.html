<scope>props={ label: string = "Interactive Value", defaultValue: string = "42", min: string = "", max: string = "", step: string = "1" } consume={ numberInput }</scope>

<div class="w-full" {...numberInput.getRootProps()}>
  <div class="mb-1 flex items-center justify-between gap-2">
    <label class="text-sm font-medium text-text transition-opacity duration-fast ease-decelerate data-[disabled]:opacity-50" {...numberInput.getLabelProps()}>Interactive Value</label>
    <span class="text-xs text-muted tabular-nums transition-colors duration-fast" {...numberInput.getValueTextProps()}>{numberInput.value}</span>
  </div>

  <div class="flex items-center gap-2" {...numberInput.getControlProps()}>
    <button
      class="flex size-6 items-center justify-center rounded-md border border-solid border-border bg-surface-raised text-sm text-text transition-all duration-fast ease-decelerate hover:bg-surface active:scale-95 data-[disabled]:cursor-not-allowed data-[disabled]:opacity-50"
      {...numberInput.getDecrementTriggerProps()}
    ><span aria-hidden="true"><span class="i-lucide-minus text-xs" aria-hidden="true"></span></span></button>
    <input
      class="h-[1.75rem] w-[5rem] rounded-md border border-solid border-border bg-surface px-2 text-sm tabular-nums text-text transition-shadow duration-fast ease-decelerate data-[focus]:ring-2 data-[focus]:ring-border-strong data-[invalid]:border-border-strong data-[invalid]:text-primary data-[disabled]:opacity-50"
      {...numberInput.getInputProps()}
    />
    <button
      class="flex size-6 items-center justify-center rounded-md border border-solid border-border bg-surface-raised text-sm text-text transition-all duration-fast ease-decelerate hover:bg-surface active:scale-95 data-[disabled]:cursor-not-allowed data-[disabled]:opacity-50"
      {...numberInput.getIncrementTriggerProps()}
    ><span aria-hidden="true"><span class="i-lucide-plus text-xs" aria-hidden="true"></span></span></button>
  </div>

  <div
    class="relative mt-2 h-[1.25rem] select-none touch-none rounded-md border border-solid border-border bg-surface-raised transition-colors duration-fast ease-decelerate data-[scrubbing]:border-border-strong data-[scrubbing]:bg-surface data-[disabled]:opacity-50"
    {...numberInput.getScrubberProps()}
  >
    <span class="pointer-events-none absolute inset-0 flex items-center justify-center gap-1 text-xs text-muted transition-opacity duration-fast ease-decelerate" aria-hidden="true"><span class="i-lucide-chevron-left text-xs" aria-hidden="true"></span><span class="i-lucide-chevron-right text-xs" aria-hidden="true"></span></span>
    <span
      class="pointer-events-none fixed z-50 size-5 rounded-md border border-solid border-border bg-surface-raised text-center text-xs text-text shadow-lg transition-opacity duration-fast ease-decelerate"
      {...numberInput.getCursorProps()}
    ><span aria-hidden="true"><span class="i-lucide-move-horizontal text-xs" aria-hidden="true"></span></span></span>
  </div>

  <div class="mt-2 text-xs text-muted">Drag the icon to scrub the value</div>
</div>
