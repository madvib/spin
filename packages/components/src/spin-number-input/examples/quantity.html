<scope>props={ label: string = "Amount", defaultValue: string = "1", min: string = "0", step: string = "1" } consume={ numberInput }</scope>

<div class="w-full" {...numberInput.getRootProps()}>
  <div class="mb-1 flex items-center justify-between gap-2">
    <label class="text-sm font-medium text-text transition-opacity duration-fast ease-decelerate data-[disabled]:opacity-50" {...numberInput.getLabelProps()}>Amount</label>
    <span class="text-xs text-muted tabular-nums transition-colors duration-fast" {...numberInput.getValueTextProps()}>{numberInput.value}</span>
  </div>

  <div class="relative inline-flex h-7 w-full items-center overflow-hidden rounded-md border border-solid border-border text-sm whitespace-nowrap transition-all duration-fast ease-decelerate data-[disabled]:opacity-50 focus-within:ring-2 focus-within:ring-border-strong" {...numberInput.getControlProps()}>
    <button
      class="flex aspect-square h-full items-center justify-center border-r border-solid border-border bg-surface-raised text-text transition-colors duration-fast ease-decelerate hover:bg-surface active:scale-95 data-[disabled]:cursor-not-allowed data-[disabled]:opacity-50"
      {...numberInput.getDecrementTriggerProps()}
    ><span aria-hidden="true"><span class="i-lucide-minus text-xs" aria-hidden="true"></span></span></button>
    <input
      class="h-full w-full grow bg-surface px-3 text-center text-sm tabular-nums text-text transition-shadow duration-fast ease-decelerate data-[focus]:ring-0 border-none outline-none"
      {...numberInput.getInputProps()}
    />
    <button
      class="flex aspect-square h-full items-center justify-center border-l border-solid border-border bg-surface-raised text-text transition-colors duration-fast ease-decelerate hover:bg-surface active:scale-95 data-[disabled]:cursor-not-allowed data-[disabled]:opacity-50"
      {...numberInput.getIncrementTriggerProps()}
    ><span aria-hidden="true"><span class="i-lucide-plus text-xs" aria-hidden="true"></span></span></button>
  </div>

  <div class="mt-2 text-xs text-muted">Enter number of items</div>
</div>
