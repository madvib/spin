<scope>props={ label: string = "Rate this", count: int = 5, allowHalf: bool = false, defaultValue: string = "", value: string = "", name: string = "", form: string = "", required: bool = false, readOnly: bool = false, disabled: bool = false, dir: string = "ltr" } consume={ ratingFsm }</scope>

<div class="inline-flex flex-col gap-2" {...ratingFsm.getRootProps()}>
  <label class="text-sm font-medium text-text transition-opacity duration-fast ease-decelerate data-[disabled]:opacity-50" {...ratingFsm.getLabelProps()}>{label}</label>

  <div class="flex items-center gap-1" {...ratingFsm.getControlProps()}>
    <template for={ratingFsm.getItems()} as={star} key={star.index}>
      <div
        class="group relative flex h-7 w-7 shrink-0 items-center justify-center rounded-md transition-transform duration-fast ease-out data-[highlighted]:scale-110 active:scale-95 focus-visible:ring-2 focus-visible:ring-border-strong data-[disabled]:cursor-not-allowed data-[disabled]:opacity-50 data-[readonly]:cursor-default"
        {...ratingFsm.getItemProps(star)}
      >
        <span aria-hidden="true" class="relative block text-lg text-muted transition-colors duration-fast">
          <span class="block">&#9733;</span>
          <span class="absolute inset-0 overflow-hidden text-primary transition-all duration-fast ease-out [width:var(--rating-fill,0%)]">
            <span class="block text-lg">&#9733;</span>
          </span>
        </span>
      </div>
    </template>
  </div>

  <input {...ratingFsm.getHiddenInputProps()} />
</div>
