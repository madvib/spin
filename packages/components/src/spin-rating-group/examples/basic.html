<scope>props={ defaultValue: string = "3.5", allowHalf: bool = true } consume={ ratingGroup }</scope>

<div class="mx-auto w-full max-w-xs text-center" {...ratingGroup.getRootProps()}>
  <div class="mb-1 text-lg font-semibold text-text">Product Rating</div>
  <div class="mb-4 text-sm text-muted">How would you rate this product?</div>
  <div
    class="inline-flex items-center gap-1"
    {...ratingGroup.getControlProps()}
  >
    <template for={ratingGroup.getItems()} as={row} key={row}>
      <span
        class="grid h-8 w-8 cursor-pointer place-items-center rounded-md text-2xl text-border-strong transition-all data-[highlighted]:scale-110 data-[highlighted]:text-semantic-warning data-[disabled]:cursor-not-allowed data-[disabled]:opacity-50 data-[readonly]:cursor-default"
        {...ratingGroup.getItemProps({ index: row })}
      >
        <span class="relative" aria-hidden="true">★︎<span class="absolute inset-y-0 right-0 w-1/2 overflow-hidden" show={ratingGroup.getItemState({ index: row }).half}><span class="absolute top-0 right-0 text-border-strong">★︎</span></span></span>
      </span>
    </template>
  </div>
  <input {...ratingGroup.getHiddenInputProps()} />
  <div class="pt-2" show={ratingGroup.value > 0}>
    <div class="text-sm font-medium text-text">You rated this {ratingGroup.value} star<span show={ratingGroup.value !== 1}>s</span></div>
    <div class="mt-1 text-xs text-muted" show={ratingGroup.value - ratingGroup.value % 1 === 1}>Poor</div>
    <div class="mt-1 text-xs text-muted" show={ratingGroup.value - ratingGroup.value % 1 === 2}>Fair</div>
    <div class="mt-1 text-xs text-muted" show={ratingGroup.value - ratingGroup.value % 1 === 3}>Good</div>
    <div class="mt-1 text-xs text-muted" show={ratingGroup.value - ratingGroup.value % 1 === 4}>Very Good</div>
    <div class="mt-1 text-xs text-muted" show={ratingGroup.value - ratingGroup.value % 1 === 5}>Excellent</div>
  </div>
</div>
