<scope>props={ defaultOpen: bool = false, open: bool, closeOnSelect: bool = true, loopFocus: bool = false, items: { value: string, label: string, disabled: bool }[] = [] } consume={ menu }</scope>

<div class="relative">
  <button class="flex items-center gap-2 rounded-lg border border-border bg-surface-raised px-4 py-2 text-sm font-medium text-text shadow-sm transition-colors hover:bg-surface" {...api.getTriggerProps()}>
    Menu
    <span aria-hidden="true" class="text-muted">▾</span>
  </button>
  <div class="absolute z-10 mt-2 min-w-16 rounded-lg border border-border bg-surface-raised p-1 shadow-lg" {...api.getContentProps()}>
    <template for={items} as={row}>
      <div class="rounded-md px-2 py-2 text-sm text-text transition-colors data-[highlighted]:bg-surface data-[disabled]:opacity-50" {...api.getItemProps(row)}>
        {row.label}
      </div>
    </template>
    <div class="my-1 border-t border-border" {...api.getSeparatorProps()}></div>
  </div>
</div>
