<scope>props={ defaultOpen: bool = false, open: bool, closeOnSelect: bool = true, loopFocus: bool = false, items: { value: string, label: string, disabled: bool }[] = [] } consume={ menu }</scope>

<div class="relative">
<button class="flex items-center gap-2 rounded-md border border-border bg-surface px-3 py-2 text-sm" {...api.getTriggerProps()}>
    Menu
<span aria-hidden="true" class="text-muted">▾</span>
  </button>
<div class="absolute z-10 mt-1 min-w-40 rounded-md border border-border bg-surface p-1 shadow-md" {...api.getContentProps()}>
    <template for={items} as={row}>
<div class="rounded px-2 py-1.5 text-sm data-[disabled]:opacity-50" {...api.getItemProps(row)}>
        {row.label}
      </div>
    </template>
<div class="my-1 border-t border-border" {...api.getSeparatorProps()}></div>
  </div>
</div>
