<scope>props={ label: string = "Tour", steps: string = "[]", defaultSteps: string = "[]", step: int = -1, spotlightPadding: int = 8, disabled: bool = false } consume={ tour }</scope>

<div class="contents" {...tour.getRootProps()}>
  <div class="pointer-events-none fixed inset-0 z-modal bg-surface-sunken opacity-70 transition-opacity duration-fast ease-decelerate data-[state=closed]:opacity-0" {...tour.getBackdropProps()}></div>

  <div class="pointer-events-none fixed z-modal rounded-lg ring-2 ring-primary transition-all duration-fast ease-decelerate [left:var(--tour-x,0px)] [top:var(--tour-y,0px)] [width:var(--tour-w,0px)] [height:var(--tour-h,0px)] data-[state=closed]:opacity-0" {...tour.getSpotlightProps()}></div>

  <div class="fixed z-modal w-[min(20rem,90vw)] rounded-lg border border-solid border-border bg-surface-raised p-3 shadow-lg transition-opacity duration-fast ease-decelerate data-[state=closed]:pointer-events-none data-[state=closed]:invisible data-[state=closed]:opacity-0 [left:var(--tour-x,0px)] [top:calc(var(--tour-y,0px)+var(--tour-h,0px)+0.5rem)]" {...tour.getPositionerProps()}>
    <div class="flex flex-col gap-2" {...tour.getContentProps()}>
      <template for={tour.getTextRows()} as={row} key={row.key}>
        <div class="flex items-center justify-between gap-2">
          <span class="text-sm font-medium text-text" {...tour.getTitleProps()}>{row.title}</span>
          <span class="text-xs text-muted tabular-nums" {...tour.getProgressTextProps()}>{row.progress}</span>
        </div>
        <p class="m-0 text-xs text-muted" {...tour.getDescriptionProps()}>{row.description}</p>
      </template>
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-1">
          <button type="button" class="bare rounded-sm px-2 py-0.5 text-xs text-muted transition-colors duration-fast ease-decelerate hover:bg-surface hover:text-text" {...tour.getPrevTriggerProps()}>Back</button>
          <button type="button" class="rounded-sm bg-primary px-2 py-0.5 text-xs font-medium text-on-primary transition-opacity duration-fast ease-decelerate hover:opacity-90" {...tour.getNextTriggerProps()}>Next</button>
        </div>
        <div class="flex items-center gap-1">
          <button type="button" class="bare rounded-sm px-2 py-0.5 text-xs text-muted transition-colors duration-fast ease-decelerate hover:bg-surface hover:text-text" {...tour.getSkipTriggerProps()}>Skip</button>
          <button type="button" class="bare rounded-sm p-0.5 text-muted transition-colors duration-fast ease-decelerate hover:bg-surface hover:text-text" {...tour.getDismissTriggerProps()}>
            <span class="i-lucide-x text-xs" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
