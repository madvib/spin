<script lang="ts">
import { toggleGroup } from "../toggle-group.presentation.ts";

const machine = toggleGroup({
  items: [{ "value": "left", "label": "Left" }, {
    "value": "center",
    "label": "Center",
  }, { "value": "right", "label": "Right" }],
  defaultValue: ["left"],
});
</script>

<div class="mx-auto flex w-full max-w-md justify-center">
  <div
    class={["inline-flex items-center gap-1 rounded-lg border border-solid border-border bg-surface-raised p-1", { "flex-col": machine.orientation === "vertical" }]}
    {...machine.getRootProps()}
  >
    <template for={machine.getItems()} as={row} key={row.value}>
      <button
        class={["bare rounded-md px-3 py-1 transition-all hover:bg-surface", { "bg-surface shadow-sm": machine.getItemState(row).pressed, "text-text-muted": !machine.getItemState(row).pressed, "cursor-not-allowed opacity-50": machine.disabled }]}
        {...machine.getItemProps(row)}
      >{row.label}</button>
    </template>
  </div>
</div>
