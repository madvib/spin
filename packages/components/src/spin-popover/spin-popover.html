<scope>props={ defaultOpen: bool = false, open: bool, modal: bool = false, portalled: bool = true, autoFocus: bool = true, title: string = "", description: string = "" } consume={ popover }</scope>

<button type="button" class="rounded-lg border border-border bg-surface-raised px-4 py-2 text-sm font-medium text-text shadow-sm transition-colors hover:bg-surface" {...popover.getTriggerProps()}>Open popover</button>
<div {...popover.getPositionerProps()}>
  <div class="bg-surface-raised border border-border rounded-lg p-4 shadow-lg" {...popover.getContentProps()}>
    <div class="text-md font-medium text-text" {...popover.getTitleProps()}>{title}</div>
    <div class="text-sm text-muted mt-1" {...popover.getDescriptionProps()}>{description}</div>
    <button type="button" class="mt-2 text-sm text-muted bg-transparent border-transparent transition-colors hover:text-text" {...popover.getCloseTriggerProps()}>Close</button>
  </div>
</div>
