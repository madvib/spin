<scope>props={ defaultOpen: bool = false, open: bool, modal: bool = false, portalled: bool = true, autoFocus: bool = true, title: string = "", description: string = "" } consume={ popover }</scope>

<button type="button" class="px-3 py-2 rounded-md border border-border text-sm" {...api.getTriggerProps()}>Open popover</button>
<div {...api.getPositionerProps()}>
  <div class="bg-surface border border-border rounded-lg p-4 shadow-lg" {...api.getContentProps()}>
    <div class="text-base font-medium" {...api.getTitleProps()}>{title}</div>
    <div class="text-sm text-muted mt-2" {...api.getDescriptionProps()}>{description}</div>
    <button type="button" class="mt-3 px-2 py-1 rounded border border-border text-sm" {...api.getCloseTriggerProps()}>Close</button>
  </div>
</div>
