<scope>props={ defaultValue: string = "121" } consume={ angleSlider }</scope>

<div class="mx-auto flex w-full max-w-xs flex-col items-center gap-4" {...angleSlider.getRootProps()}>
  <div
    class="relative flex h-[15rem] w-[15rem] touch-none items-center justify-center select-none"
    {...angleSlider.getControlProps()}
  >
    <svg class="absolute inset-0 h-full w-full -rotate-90" viewBox="0 0 200 200" aria-hidden="true">
      <circle cx="100" cy="100" r="80" class="fill-none stroke-surface-sunken" stroke-width="20" />
      <circle cx="100" cy="100" r="80" class="fill-none stroke-primary" stroke-width="20" stroke-linecap="round"
        stroke-dasharray={502.65} stroke-dashoffset={502.65 * (1 - angleSlider.value / 360)} />
    </svg>
    <span
      class="absolute h-[1.75rem] w-[1.75rem] -translate-1/2 rounded-full border-2 border-solid border-primary bg-surface data-[disabled]:opacity-50"
      {...angleSlider.getThumbProps()}
    ></span>
    <span class="flex flex-col items-center" {...angleSlider.getValueTextProps(angleSlider.valueAsDegree)}>
      <span class="text-4xl font-bold tabular-nums text-text">{angleSlider.value}°</span>
      <span class="text-sm font-medium text-muted">degrees</span>
    </span>
  </div>
  <input {...angleSlider.getHiddenInputProps()} />
</div>
