<scope>props={ defaultValue: string = "45" } consume={ angleSlider }</scope>

<div class="mx-auto flex w-full max-w-xs items-center justify-center" {...angleSlider.getRootProps()}>
  <div
    class="relative flex h-[15rem] w-[15rem] touch-none items-center justify-center rounded-full border border-solid border-border bg-surface-raised select-none"
    {...angleSlider.getControlProps()}
  >
    <span
      class="pointer-events-none absolute inset-y-0 left-1/2 -ml-px w-[2px]"
      {...angleSlider.getThumbProps({ needle: true })}
    >
      <span class="absolute inset-x-0 top-0 block h-[17%] rounded-full bg-primary" aria-hidden="true"></span>
    </span>
    <div class="pointer-events-none absolute inset-px" {...angleSlider.getMarkerGroupProps()}>
      <template for={angleSlider.getMarkers()} as={row} key={row}>
        <span
          class="absolute inset-y-0 left-1/2 -ml-px w-[2px]"
          {...angleSlider.getMarkerProps({ value: row, diameter: true })}
        >
          <span class="absolute inset-x-0 top-[6%] block h-[11%] rounded-full bg-border-strong data-[state=at-value]:bg-primary" aria-hidden="true"></span>
        </span>
      </template>
    </div>
    <span class="flex flex-col items-center" {...angleSlider.getValueTextProps(angleSlider.valueAsDegree)}>
      <span class="text-4xl font-bold tabular-nums text-text">{angleSlider.value}°</span>
      <span class="text-sm font-medium text-muted">degrees</span>
    </span>
  </div>
  <input {...angleSlider.getHiddenInputProps()} />
</div>
