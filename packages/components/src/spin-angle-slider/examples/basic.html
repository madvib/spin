<scope>props={ defaultValue: string = "45" } consume={ angleSlider }</scope>

<div class="flex w-full max-w-xs flex-col items-center gap-4" {...angleSlider.getRootProps()}>
  <div
    class="relative h-[15rem] w-[15rem] touch-none rounded-full border border-solid border-border bg-surface-raised select-none"
    {...angleSlider.getControlProps()}
  >
    <div class="pointer-events-none absolute inset-0" {...angleSlider.getMarkerGroupProps()}>
      <template for={angleSlider.getMarkers()} as={row} key={row}>
        <span
          class="absolute h-[1rem] w-[2px] -translate-x-1/2 bg-border-strong data-[state=at-value]:bg-primary"
          {...angleSlider.getMarkerProps({ value: row })}
        ></span>
      </template>
    </div>
    <span
      class="absolute h-[1.75rem] w-[1.75rem] rounded-full border-2 border-solid border-primary bg-surface shadow-sm data-[disabled]:opacity-50"
      {...angleSlider.getThumbProps()}
    ></span>
  </div>
  <span class="rounded-md border border-solid border-border bg-surface-sunken px-2 py-0.5 font-mono text-sm tabular-nums text-text" {...angleSlider.getValueTextProps(angleSlider.valueAsDegree)}>{angleSlider.valueAsDegree}</span>
  <input {...angleSlider.getHiddenInputProps()} />
</div>
