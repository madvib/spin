<scope>props={ defaultValue: string = "121" } consume={ angleSlider }</scope>

<div class="mx-auto flex w-full max-w-xs flex-col items-center gap-4" {...angleSlider.getRootProps()}>
  <div class="relative p-8">
    <div class="pointer-events-none absolute inset-0" aria-hidden="true">
      <span class="absolute -translate-1/2 font-mono text-xs text-muted left-[50.0%] top-[5.3%]">0°</span>
      <span class="absolute -translate-1/2 font-mono text-xs text-muted left-[81.6%] top-[18.4%]">45°</span>
      <span class="absolute -translate-1/2 font-mono text-xs text-muted left-[94.7%] top-[50.0%]">90°</span>
      <span class="absolute -translate-1/2 font-mono text-xs text-muted left-[81.6%] top-[81.6%]">135°</span>
      <span class="absolute -translate-1/2 font-mono text-xs text-muted left-[50.0%] top-[94.7%]">180°</span>
      <span class="absolute -translate-1/2 font-mono text-xs text-muted left-[18.4%] top-[81.6%]">225°</span>
      <span class="absolute -translate-1/2 font-mono text-xs text-muted left-[5.3%] top-[50.0%]">270°</span>
      <span class="absolute -translate-1/2 font-mono text-xs text-muted left-[18.4%] top-[18.4%]">315°</span>
    </div>
    <div
      class="relative flex h-[15rem] w-[15rem] touch-none items-center justify-center rounded-full border border-solid border-border bg-surface-raised select-none"
      {...angleSlider.getControlProps()}
    >
      <svg class="pointer-events-none absolute inset-0 h-full w-full" viewBox="0 0 200 200" aria-hidden="true">
      <line x1="100" y1="100" x2="100" y2="22" class="stroke-primary" stroke-width="4" stroke-linecap="round"
        transform={"rotate(" + angleSlider.value + " 100 100)"} />
    </svg>
    <div class="pointer-events-none absolute inset-0" {...angleSlider.getMarkerGroupProps()}>
        <template for={angleSlider.getMarkers()} as={row} key={row}>
          <span
            class="absolute h-[1rem] w-[2px] -translate-1/2 bg-border-strong data-[state=under-value]:bg-semantic-success data-[state=at-value]:bg-primary"
            {...angleSlider.getMarkerProps({ value: row })}
          ></span>
        </template>
      </div>
      <span class="flex flex-col items-center" {...angleSlider.getValueTextProps(angleSlider.valueAsDegree)}>
        <span class="text-4xl font-bold tabular-nums text-text">{angleSlider.value}°</span>
        <span class="text-sm font-medium text-muted">degrees</span>
      </span>
    </div>
  </div>
  <input {...angleSlider.getHiddenInputProps()} />
</div>
