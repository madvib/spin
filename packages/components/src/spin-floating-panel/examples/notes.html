<scope>props={ label: string = "Notes", defaultOpen: bool = true, defaultSize: string = '{"w":460,"h":480}', defaultMinSize: string = '{"w":360,"h":400}', defaultMaxSize: string = '{"w":600,"h":640}' } consume={ floatingPanel }</scope>

<div class="grid gap-2">
  <button class="mb-2 rounded-md border border-solid border-border bg-surface-raised px-3 py-1.5 text-sm font-medium text-text shadow-sm hover:bg-surface" {...floatingPanel.getTriggerProps()}>Open panel</button>
  <div class="relative h-[24rem] w-full" {...floatingPanel.getPositionerProps()}>
    <div class="absolute left-0 top-0 flex flex-col overflow-hidden rounded-lg border border-solid border-border bg-surface-raised shadow-lg data-[state=closed]:pointer-events-none data-[state=closed]:invisible data-[state=closed]:scale-95 data-[state=closed]:opacity-0 data-[stage=minimized]:h-12 data-[stage=minimized]:overflow-hidden data-[stage=maximized]:h-full data-[stage=maximized]:w-full" {...floatingPanel.getContentProps()}>
      <div class="flex items-center justify-between gap-2 border-b border-border p-3 cursor-grab data-[dragging]:cursor-grabbing" {...floatingPanel.getDragTriggerProps()}>
        <div class="flex min-w-0 items-center gap-2">
          <span class="i-lucide-grip-vertical shrink-0 text-sm text-muted" aria-hidden="true"></span>
          <span class="truncate text-sm font-medium text-text">Notes</span>
        </div>
        <div class="flex shrink-0 items-center gap-1"><button class="ghost flex h-6 max-h-6 min-h-0 w-6 items-center justify-center rounded-md p-0 text-muted hover:bg-surface hover:text-text" {...floatingPanel.getStageTriggerProps({ stage: "minimized" })}><span class="i-lucide-minus text-xs" aria-hidden="true"></span></button>
          <button class="ghost flex h-6 max-h-6 min-h-0 w-6 items-center justify-center rounded-md p-0 text-muted hover:bg-surface hover:text-text" {...floatingPanel.getStageTriggerProps({ stage: "maximized" })}><span class="i-lucide-square text-xs" aria-hidden="true"></span></button>
          <button class="ghost flex h-6 max-h-6 min-h-0 w-6 items-center justify-center rounded-md p-0 text-muted hover:bg-surface hover:text-text" {...floatingPanel.getStageTriggerProps({ stage: "default" })}><span class="i-lucide-copy text-xs" aria-hidden="true"></span></button>
          <button class="ghost flex h-6 max-h-6 min-h-0 w-6 items-center justify-center rounded-md p-0 text-muted hover:bg-surface hover:text-text" {...floatingPanel.getCloseTriggerProps()}><span class="i-lucide-x text-xs" aria-hidden="true"></span></button></div>
      </div>
<div class="grid min-h-0 flex-1 grid-cols-[13rem_1fr] overflow-hidden">
        <div class="grid min-h-0 content-start gap-2 overflow-y-auto border-r border-border bg-surface p-3">
          <div class="flex items-center gap-2 rounded-md border border-solid border-border bg-surface-raised px-3 py-2 text-xs text-muted"><span class="i-lucide-search text-sm" aria-hidden="true"></span><span>Search notes…</span></div>
          <button type="button" data-new class="flex min-h-0 items-center justify-center gap-1 rounded-md bg-primary p-2 text-sm font-medium text-on-primary hover:bg-primary"><span class="i-lucide-plus text-sm" aria-hidden="true"></span>New Note</button>
          <div data-notes class="grid content-start gap-1">
            <button type="button" data-note="0" class="grid justify-items-start gap-1 whitespace-normal rounded-md bg-surface-raised p-3 text-left">
              <p class="m-0 text-sm font-medium text-text">Meeting Notes</p>
              <p class="m-0 text-xs text-muted">Discussed project timeline and deliverables…</p>
              <p class="m-0 text-xs text-muted">Today</p>
            </button>
            <button type="button" data-note="1" class="grid justify-items-start gap-1 whitespace-normal rounded-md p-3 text-left hover:bg-surface">
              <p class="m-0 text-sm font-medium text-text">Ideas</p>
              <p class="m-0 text-xs text-muted">New feature ideas for the dashboard…</p>
              <p class="m-0 text-xs text-muted">Yesterday</p>
            </button>
            <button type="button" data-note="2" class="grid justify-items-start gap-1 whitespace-normal rounded-md p-3 text-left hover:bg-surface">
              <p class="m-0 text-sm font-medium text-text">Shopping List</p>
              <p class="m-0 text-xs text-muted">Milk, Bread, Eggs, Coffee beans…</p>
              <p class="m-0 text-xs text-muted">2 days ago</p>
            </button>
          </div>
        </div>
<div class="grid min-h-0 content-start gap-3 overflow-y-auto p-4">
          <p class="m-0 flex items-center gap-2 text-xs text-muted"><span class="i-lucide-pencil text-sm" aria-hidden="true"></span><span data-edited>Last edited Today</span></p>
          <input data-title value="Meeting Notes" class="w-full min-w-0 rounded-md border border-solid border-transparent bg-transparent px-2 py-1 text-md font-semibold text-text hover:border-border focus:border-primary" />
          <textarea data-body rows="6" class="min-h-0 w-full resize-none rounded-md border border-solid border-transparent bg-transparent px-2 py-1 text-sm text-text hover:border-border focus:border-primary">Discussed project timeline and deliverables…</textarea>
        </div>
      </div>
                  <button class="absolute inset-x-0 top-0 h-1 min-h-0 border-0 border-solid p-0 cursor-ns-resize" {...floatingPanel.getResizeTriggerProps("n")} aria-hidden="true"></button>
      <button class="absolute inset-x-0 bottom-0 h-1 min-h-0 border-0 border-solid p-0 cursor-ns-resize" {...floatingPanel.getResizeTriggerProps("s")} aria-hidden="true"></button>
      <button class="absolute inset-y-0 right-0 w-1 min-h-0 border-0 border-solid p-0 cursor-ew-resize" {...floatingPanel.getResizeTriggerProps("e")} aria-hidden="true"></button>
      <button class="absolute inset-y-0 left-0 w-1 min-h-0 border-0 border-solid p-0 cursor-ew-resize" {...floatingPanel.getResizeTriggerProps("w")} aria-hidden="true"></button>
      <button class="absolute right-0 top-0 h-2 min-h-0 w-2 border-0 border-solid p-0 cursor-nesw-resize" {...floatingPanel.getResizeTriggerProps("ne")} aria-hidden="true"></button>
      <button class="absolute left-0 top-0 h-2 min-h-0 w-2 border-0 border-solid p-0 cursor-nwse-resize" {...floatingPanel.getResizeTriggerProps("nw")} aria-hidden="true"></button>
      <button class="absolute right-0 bottom-0 h-2 min-h-0 w-2 border-0 border-solid p-0 cursor-nwse-resize" {...floatingPanel.getResizeTriggerProps("se")} aria-hidden="true"></button>
      <button class="absolute left-0 bottom-0 h-2 min-h-0 w-2 border-0 border-solid p-0 cursor-nesw-resize" {...floatingPanel.getResizeTriggerProps("sw")} aria-hidden="true"></button>
    </div>
  </div>
</div>
