<scope>props={ nodes: string = "[]", defaultExpandedValue: string[] = [], expandedValue: string[] = [], selectedValue: string[] = [], selectionMode: string = "single", expandOnClick: bool = true, typeahead: bool = true, loadChildren: string = "", rename: bool = true } consume={ treeView }</scope>

<div class="rounded-lg border border-border bg-surface-raised p-1"
  {...treeView.getRootProps()}>
  <template for={treeView.getVisibleRows()} as={row} key={row.node.value}>
    <div
      class="group flex cursor-default items-center gap-2 rounded-md py-1 pe-2 [padding-inline-start:var(--tree-indent,0.5rem)] text-sm text-text transition-colors duration-fast ease-standard hover:bg-surface data-[selected]:bg-surface data-[selected]:font-medium data-[focus]:ring-1 data-[focus]:ring-border-strong data-[disabled]:opacity-50 data-[disabled]:pointer-events-none"
      {...treeView.getItemProps(row)}
    >
      <button
        class="bare flex size-4 shrink-0 items-center justify-center text-muted transition-transform duration-fast ease-standard data-[state=open]:rotate-90 hover:text-text"
        {...treeView.getBranchControlProps(row)}
      >
        <span class="block text-xs leading-none"
          {...treeView.getBranchIndicatorProps(row)}>›</span>
      </button>
      <span aria-hidden="true"
        class="size-1 shrink-0 rounded-full bg-border-strong data-[state=open]:bg-primary group-hover:bg-border-strong"
        {...treeView.getCheckboxProps(row)}></span>
      <span class="min-w-0 truncate"
        {...treeView.getBranchTextProps(row)}>{row.node.label}</span>
      <span class="ms-auto shrink-0 text-xs text-muted"
        {...treeView.getLoadingProps(row)}>…</span>
      <input
        class="ms-6 w-[calc(100%-1.5rem)] rounded-md border border-border-strong bg-surface px-2 py-1 text-sm text-text"
        {...treeView.getRenameInputProps(row)}
      />
    </div>
  </template>
</div>
