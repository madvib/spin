<scope>props={ items: { value: string, label: string }[] = [{"value":"sm","label":"S"},{"value":"md","label":"M"},{"value":"lg","label":"L"},{"value":"xl","label":"XL"}], defaultValue: string = '["md"]' } consume={ toggleGroup }</scope>
