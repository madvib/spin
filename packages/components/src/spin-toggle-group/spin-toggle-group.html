<scope>props={ items: string = "[]", label: string = "Format", multiple: bool = false, deselectable: bool = true, rovingFocus: bool = true, loopFocus: bool = true, orientation: string = "", disabled: bool = false, defaultValue: string = "[]", value: string = "[]" } consume={ toggleGroup }</scope>

<div class="w-full">
  <span class="mb-1 block text-sm font-medium text-text">{label}</span>
  <div
    class="inline-flex items-center gap-1 rounded-lg border border-solid border-border bg-surface-raised p-1 data-[orientation=vertical]:flex-col"
    {...toggleGroup.getRootProps()}
  >
    <template for={toggleGroup.getItems()} as={row} key={row.value}>
      <button
        type="button"
        class="rounded-md px-3 py-1.5 text-sm font-medium text-muted transition-all duration-fast ease-decelerate hover:bg-surface hover:text-text data-[state=on]:bg-primary data-[state=on]:text-on-primary data-[disabled]:cursor-not-allowed data-[disabled]:opacity-50"
        {...toggleGroup.getItemProps(row)}
      >{row.label}</button>
    </template>
  </div>
</div>
