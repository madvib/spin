<scope>props={ label: string = "Signature", name: string = "", required: bool = false, disabled: bool = false, readOnly: bool = false, defaultPaths: string = "[]", paths: string = "[]" } consume={ signaturePad }</scope>

<div class="w-full" {...signaturePad.getRootProps()}>
  <label class="mb-1 block text-sm font-medium text-text" {...signaturePad.getLabelProps(label)}>{label}</label>
  <div
    class="relative h-60 w-full touch-none overflow-hidden rounded-lg border border-solid border-border bg-surface select-none transition-colors duration-fast ease-decelerate data-[disabled]:opacity-50"
    {...signaturePad.getControlProps()}
  >
    <svg {...signaturePad.getSegmentProps()}>
      <template for={signaturePad.paths} as={row} key={row}>
        <path {...signaturePad.getSegmentPathProps({ path: row })}></path>
      </template>
    </svg>
    <span class="pointer-events-none absolute inset-0 flex items-center justify-center text-sm text-muted" {...signaturePad.getGuideProps()}>Sign here</span>
    <button
      class="absolute right-2 top-2 rounded-md border border-solid border-border bg-surface px-2 py-1 text-xs text-text transition-colors duration-fast ease-decelerate data-[hidden]:hidden"
      {...signaturePad.getClearTriggerProps("Clear signature")}
    >Clear</button>
  </div>
  <input {...signaturePad.getHiddenInputProps(name)} />
</div>
