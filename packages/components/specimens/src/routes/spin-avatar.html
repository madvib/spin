<scope>props={ src: string = "", defaultSrc: string = "", label: string = "Avatar", fallback: string = "" } consume={ avatar }</scope>

<span
  class="relative grid h-10 w-10 shrink-0 place-items-center overflow-hidden rounded-full bg-surface-sunken text-sm font-medium text-muted transition-colors duration-fast ease-decelerate"
  {...avatar.getRootProps()}
>
  <img
    class="h-full w-full object-cover data-[hidden]:hidden"
    draggable="false"
    {...avatar.getImageProps()}
  />
  <span
    aria-hidden="true"
    class="grid h-full w-full place-items-center data-[hidden]:hidden"
    {...avatar.getFallbackProps()}
  >{fallback}</span>
</span>
