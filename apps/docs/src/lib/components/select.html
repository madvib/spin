<script lang="ts">
import { select } from "@spinjs/components";

// A copy of the select example, owned by this app: the package-manager
// choices are the docs' data, not the library's.
const machine = select({
  value: "bun",
  items: [
    { value: "bun", label: "bun" },
    { value: "npm", label: "npm" },
    { value: "pnpm", label: "pnpm" },
    { value: "yarn", label: "yarn" },
    { value: "deno", label: "deno" },
  ],
});
</script>
<div class="relative w-20 shrink-0" {...machine.getRootProps()}>
  <span class="sr-only" {...machine.getLabelProps()}>Package manager</span>

  <div class="flex items-center gap-1" {...machine.getControlProps()}>
    <button
      class={["bare flex h-8 min-w-0 flex-1 items-center gap-1 rounded-md border bg-surface px-2 type-label transition-colors duration-fast ease-decelerate hover:bg-surface-raised", { "bg-surface-raised border-strong": machine.open, "ring-2 ring-border-strong": machine.focused, "opacity-50 cursor-not-allowed": machine.disabled }]}
      {...machine.getTriggerProps()}
    >
      <span class="min-w-0 flex-1 truncate text-left"
        {...machine.getValueTextProps()}>
        <template for={machine.getSelectedRows()} as={row} key={row.value}>
          <span>{row.label}</span>
        </template>
      </span>
      <span
        aria-hidden="true"
        class={["shrink-0 text-muted transition-transform duration-fast ease-decelerate", { "rotate-180": machine.open }]}
        {...machine.getTriggerIndicatorProps()}
      ><span class="i-lucide-chevron-down type-caption" aria-hidden="true"></span></span>
    </button>
  </div>

  <div
    class={["absolute z-dropdown left-0 top-full mt-1 w-full origin-top-left transition duration-fast ease-decelerate min-w-[12rem]", { "pointer-events-none invisible scale-95 opacity-0": !machine.open }]}

  >
    <panel
      class="max-h-56 overflow-y-auto overscroll-contain"
      {...machine.getContentProps()}
    >
      <panel-list role="group" {...machine.getListProps()}>
        <template for={machine.getRows()} as={row} key={row.value}>
          <div
            class="flex cursor-default items-center gap-2 rounded-md px-2 py-1 type-body transition-colors duration-fast ease-decelerate"
            {...machine.getItemProps(row)}
          >
            <span class="min-w-0 flex-1 truncate"
              {...machine.getItemTextProps(row)}>{row.label}</span>
            <span
              aria-hidden="true"
              class={["shrink-0 text-primary opacity-0 transition-opacity duration-fast ease-decelerate", { "opacity-100": machine.getItemState(row).selected }]}

            ><span class="i-lucide-check type-caption" aria-hidden="true"></span></span>
          </div>
        </template>
      </panel-list>

    aria-hidden="true"></select>
</div>
