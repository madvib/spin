<title>spin · zag tree-view</title>
<style>/* layer: theme */
body {
  font-family: var(--font-family-body, var(--font-family-sans));
  color: var(--color-text);
  background-color: var(--color-surface);
}

body, h1, h2, h3, h4, h5, h6, p, ul, ol, figure, blockquote {
  margin: 0;
}

input, textarea, select, button {
  font: inherit;
}

  *, ::before, ::after {
    animation-duration: 0.01ms !important;

/* layer: primitives */
/*
 * Motion — the one global namespace in CSS, given one home.
 *
 * Every keyframe in the system lives in this file, next to the class that
 * names it. That adjacency is the point: `@keyframes` cannot be scoped or
 * shaken, so a keyframe whose definition sits in a shakeable component file
 * is a keyframe that can be shipped without its definition. Two files owning
 * one name means the second silently wins.
 *
 * Keyframes are the library's to author — a rotation is a rotation regardless
 * of theme. What a theme owns is timing: every utility below spends the motion
 * scale rather than naming a duration, so a theme sets the motion feel once
 * and every animation in the system inherits it.
 *
 * Markup contract:
 *   .animate-spin           continuous rotation — spinners
 *   .animate-ping           scale and fade outward — status dots
 *   .animate-pulse          opacity fade — skeleton placeholders
 *   .animate-fade-in        one-shot opacity entrance
 *   .animate-slide-up       one-shot rise and fade
 *   .animate-none           the escape hatch for overriding at a breakpoint
 *
 * Theming:
 *   spent bindings  `--motion-duration-*` and `--motion-easing-*`. No token is
 *                   minted: a theme moves every animation by moving the scale.
 *   character       None. Motion is not a decision a theme gets to author per
 *                   component — it is one feel, expressed once.
 *
 * States: none. These run, they do not respond.
 *
 * Motion:
 *   Durations and easings come from the theme scale. `progress-indeterminate`
 *   uses a literal because a sweep has no upper bound to scale against; it is
 *   the single exception in the file and it is visible.
 *
 * ARIA + AT:
 *   Motion is decoration. The global reduced-motion clamp in `@spin/theme/base`
 *   stops all of it when a reader asks, so nothing here needs to re-check.
 *   A spinner still needs an accessible name at its call site — the animation
 *   conveys nothing to a screen reader.
 */

/* ---------- keyframes ---------- */

@keyframes spin {
  to {
    transform: rotate(1turn);
  }
}

@keyframes ping {
  75%,
  100% {
    opacity: 0;
    transform: scale(2);
  }
}

@keyframes pulse {
  50% {
    opacity: 0.5;
  }
}

@keyframes fade-in {
  from {
    opacity: 0;
  }
}

@keyframes slide-up {
  from {
    opacity: 0;
    transform: translateY(var(--motion-distance, 0.75rem));
  }
}

@keyframes progress-indeterminate {
  from {
    transform: translateX(-100%);
  }
  to {
    transform: translateX(100%);
  }
}

/* ---------- utilities ---------- */

.animate-spin {
  animation: spin var(--motion-duration-slow) var(--motion-easing-linear)
    infinite;
}

.animate-ping {
  animation: ping var(--motion-duration-slow) var(--motion-easing-linear)
    infinite;
}

.animate-pulse {
  animation: pulse var(--motion-duration-slow) var(--motion-easing-standard)
    infinite;
}

.animate-fade-in {
  animation: fade-in var(--motion-duration-base) var(--motion-easing-decelerate)
    backwards;
}

.animate-slide-up {
  animation: slide-up var(--motion-duration-base)
    var(--motion-easing-decelerate) backwards;
}

.animate-none {
  animation: none;
}

/* ---------- component keyframes ---------- */

/* Dialog and backdrop entrances. Shapes are the library's; a theme moves them
   by moving the motion scale. */
@keyframes dialog-in {
  from {
    opacity: 0;
    transform: translateY(0.5rem) scale(0.98);
  }
}

@keyframes backdrop-in {
  from {
    opacity: 0;
  }
}

/* The indeterminate sweep. A literal duration because a sweep has no upper
   bound to scale against — the single exception in this file. */
@keyframes progress-indeterminate {
  from {
    background-position: 200% 0;
  }
  to {
    background-position: -200% 0;
  }
}
/*
 * Semantic button.
 *
 * The theme owns the *control*, not the `<button>` tag. A button is whatever
 * the author says acts like one: the element, the three legacy `<input>`
 * types that browsers still emit, or anything carrying `role="button"` —
 * which is what a `<div>` or a styled link becomes once it starts behaving as a
 * control. All of them get the same finished treatment: metrics, states, and a
 * focus ring, all themed.

 * Three kinds of value appear here, and the difference is the whole design:
 *
 *   utilities      Everything a utility expresses is one — the gap, the type,
 *                   the radius, the padding. No token is minted, because the
 *                   author of the CSS has no choice to express: a theme moves
 *                   the button by moving the scale, and neobrut's square radius
 *                   reaches every button with no button token in sight.
 *
 *   character       A decision a theme genuinely owns and an author may want to
 *                   override per component — the weight, the case, the tracking,
 *                   the two elevations. These are minted as `button.*` tokens
 *                   because the choice is real and a studio should surface it.
 *
 *   composites      What no utility expresses: the derived min-height, the
 *                   themed border and outline, the spinner's timing. Each
 *                   carries a one-line comment saying why it cannot be a
 *                   utility.
 *
 * Markup contract:
 *   <button>                       primary
 *   <input type="submit">           also primary — a button by another name
 *   <div role="button">             also primary, and now keyboard-usable
 *   <button class="secondary">      filled with the surface, not the brand
 *   <button class="contrast">       the loudest variant, for the main action
 *   <button class="ghost">          no fill until hover
 *   <button class="outline">        border only, on the brand color
 *   <button class="danger">         destructive, uses on-danger
 *   <button class="s-sm|s-lg">       size, default is md
 *   <button class="icon">           square, for a lone glyph
 *   <button aria-busy="true">       shows a spinner, suppresses the icon
 *   <span role="group">             joins buttons into a segmented control
 *
 * A `<button type="reset">` is the one legacy type that reads as secondary with
 * no class, matching what the browser means by it.
 *
 * `.button-icon` is a slot, not a style: it only reserves room and lets the
 * glyph inherit `currentColor`, so an icon can never drift from the label's
 * color the way a `fill="currentColor"` attribute would drift.
 */

/* ---------- base ---------- */

:is(button, [type="submit"], [type="reset"], [type="button"], [role="button"]) {
  /* Layout: a button is a flex row so an icon and a label can sit inside it
     with one gap, whatever combination the author writes. */
  align-items:center;justify-content:center;display:inline-flex;text-align:center;text-decoration:none;white-space:nowrap;cursor:pointer;user-select:none;

  box-sizing: border-box;
  vertical-align: middle;

  /* Gap, type and padding are utilities. The inline pair `ps-4 pe-4` flips
     with the writing direction; block padding is `py-2` because the preset
     has no logical block utility — the one gap worth naming. */
  padding-inline-start:var(--spacing-4);padding-inline-end:var(--spacing-4);padding-top:var(--spacing-2);padding-bottom:var(--spacing-2);gap:var(--spacing-2);font-family:var(--font-family-sans);font-size:var(--font-size-md);border-radius:var(--radius-md);

  line-height: 1;
  /* Height is derived, not stated: a button is as tall as its text plus its
     padding plus its borders, so the three can never disagree. */
  min-height: calc(
    var(--font-size-md) + (2 * var(--spacing-2)) + (2 *
    var(--border-width))
  );

  /* Character: what a theme owns outright, with no scale behind it. */
  font-weight: var(--button-weight);
  text-transform: var(--button-case);
  letter-spacing: var(--button-tracking);

  /* The edge stays one declaration: no utility expresses a themed border
     shorthand (`border` would emit a literal width a theme could not move),
     and the colour cannot be a `border-on-primary` utility here because the
     label's `text-on-primary` swallows it — see `.outline` for why. */
  border: var(--border-width) solid var(--color-on-primary);

  /* Colour, default variant. */
  background-color:var(--color-primary);
  color:var(--color-on-primary);
  box-shadow: var(--button-shadow);

  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;

  /* Five properties, so five utilities. A `transition` shorthand would name
     each property and repeat the timing by hand. */
  transition-property:color, background-color, border-color, text-decoration-color, fill, stroke;
  transition-property:box-shadow;
  transition-property:transform, translate, scale, rotate;
  transition-duration:var(--motion-duration-fast);
  transition-timing-function:var(--motion-easing-standard);
}

/* ---------- states ---------- */

/* Hover is theme-defined feedback: neobrut grows its offset shadow and lifts,
   the default theme only softens. The shadow is a character token; the lift is
   opt-in — a theme that wants one states button.hover-lift-x/y and the
   preflight emits it, and the fallback is the no-movement default. */
:is(button, [type="submit"], [type="reset"], [type="button"], [role="button"]):hover:not(:disabled):not([aria-busy="true"]) {
  box-shadow: var(--button-shadow-hover);
  transform: translate(var(--button-hover-lift-x, 0px),
    var(--button-hover-lift-y, 0px));
}

/* Active is the press. It cancels the hover lift so the control reads as
   pushed *into* the page rather than pulled out of it. */
:is(button, [type="submit"], [type="reset"], [type="button"], [role="button"]):active:not(:disabled):not([aria-busy="true"]) {
  transform: translate(0, 0);
  box-shadow: var(--button-shadow);
}

/* Focus ring is drawn on the focus-visible ring so a mouse press never leaves
   a ring behind, but keyboard focus always does. The offset keeps the ring
   clear of the button's own border, which matters for themes with heavy
   borders. No utility expresses an outline from --focus-width and a colour,
   nor an outline-offset from --focus-offset, so both stay declarations. */
:is(button, [type="submit"], [type="reset"], [type="button"], [role="button"]):focus-visible {
  outline: var(--focus-width) solid var(--color-focus-ring);
  outline-offset: var(--focus-offset);
}

/* Remove the UA default focus ring only where :focus-visible is supported.
   Without the @supports guard this would blind keyboard users on old engines. */
:is(button, [type="submit"], [type="reset"], [type="button"], [role="button"]):focus:not(:focus-visible) {
  outline: none;
}

/* The same ring for engines without :focus-visible — no utility expresses it. */
@supports not selector(:focus-visible) {
  button:focus {
    outline: var(--focus-width) solid var(--color-focus-ring);
    outline-offset: var(--focus-offset);
  }
}

:is(button, [type="submit"], [type="reset"], [type="button"], [role="button"]):disabled,
:is(button, [type="submit"], [type="reset"], [type="button"], [role="button"])[aria-disabled="true"] {
  opacity: 0.55;
  cursor: not-allowed;
  transform: none;
  box-shadow: var(--button-shadow);
}

/* ---------- loading ---------- */

/* Busy buttons keep their width so a row of buttons does not reflow when one
   of them starts working. The spinner is a border trick rather than an
   animation keyframe set, so it inherits currentColor for free; its duration
   is the theme's fast step times four, so a theme that quickens its motion
   quickens the spinner — no utility expresses a calc. */
:is(button, [type="submit"], [type="reset"], [type="button"], [role="button"])[aria-busy="true"] {
  cursor: progress;
}

:is(button, [type="submit"], [type="reset"], [type="button"], [role="button"])[aria-busy="true"]::after {
  content: "";
  box-sizing: border-box;
  width: 1em;
  height: 1em;
  flex: none;
  border: 2px solid currentColor;
  border-block-start-color: transparent;
  border-radius: 50%;
  animation: spin calc(var(--motion-duration-fast) * 4) linear infinite;
}

:is(button, [type="submit"], [type="reset"], [type="button"], [role="button"])[aria-busy="true"] > .button-icon {
  display: none;
}

/* ---------- sizes ---------- */

/* Sizes spend the same scales at different steps. Padding and type move
   together, so a small button is proportionally the same control. */
:is(button, [type="submit"], [type="reset"], [type="button"], [role="button"]).s-sm {
  padding-inline-start:var(--spacing-2);padding-inline-end:var(--spacing-2);padding-top:var(--spacing-1);padding-bottom:var(--spacing-1);font-size:var(--font-size-sm);
  min-height: calc(
    var(--font-size-sm) + (2 * var(--spacing-1)) + (2 *
    var(--border-width))
  );
}

:is(button, [type="submit"], [type="reset"], [type="button"], [role="button"]).s-lg {
  padding-inline-start:var(--spacing-8);padding-inline-end:var(--spacing-8);padding-top:var(--spacing-4);padding-bottom:var(--spacing-4);font-size:var(--font-size-lg);
  min-height: calc(
    var(--font-size-lg) + (2 * var(--spacing-4)) + (2 *
    var(--border-width))
  );
}

/* Square button for a lone glyph. Padding is dropped and the aspect ratio does
   the rest, so the box stays perfectly round at every size. */
:is(button, [type="submit"], [type="reset"], [type="button"], [role="button"]).icon {
  width: auto;
  padding-inline: 0;
  aspect-ratio: 1;
}

/* ---------- variants ---------- */

:is(button, [type="submit"], [type="reset"], [type="button"], [role="button"]).secondary {
  background-color:var(--color-surface-raised);border-color:var(--color-border);color:var(--color-text);
}

:is(button, [type="submit"], [type="reset"], [type="button"], [role="button"]).ghost {
  background-color:transparent;border-color:transparent;color:var(--color-text);
}

:is(button, [type="submit"], [type="reset"], [type="button"], [role="button"]).ghost:hover:not(:disabled):not([aria-busy="true"]) {
  background-color:transparent;border-color:transparent;color:var(--color-text);
}

/* Destructive. No border utility on purpose: the theme has no `danger` colour
   to spend on one — only `on-danger` for the label and `semantic-error` for
   the fill, and reusing the fill's token would name one token twice in a
   single `--at-apply`. The border falls through to the base rule's
   `--color-on-primary`, the same colour this variant renders today. */
:is(button, [type="submit"], [type="reset"], [type="button"], [role="button"]).danger {
  background-color:var(--color-semantic-error);color:var(--color-on-danger);
}

/* The loudest variant: brand fill on the page's own text color, so it is the
   highest-contrast control available. Reserved for the one action a screen is
   about, because two of these on one page is noise. */
:is(button, [type="submit"], [type="button"], [role="button"]).contrast {
  background-color:var(--color-text);border-color:var(--color-text);color:var(--color-surface);
}

/* Border only, on the brand color. For a page that already has a filled
   primary and needs a second action without competing with it.

   The border spends `accent`, not `primary`: the directive transformer
   merges a whole `--at-apply` into one body and drops any declaration whose
   text is already a substring of it — a border colour declaration contains
   the label's colour declaration as a substring, so a primary border would
   silently delete the primary label's colour. `accent` is the theme's brand
   colour that is distinct from primary by design, which is what an outline is. */
:is(button, [type="submit"], [type="reset"], [type="button"], [role="button"]).outline {
  background-color:transparent;border-color:var(--color-accent);color:var(--color-primary);
}

/* Hover holds the outline's tokens, so the border stays `accent` for the
   reason `.outline` gives — a primary border would delete the label's colour. */
:is(button, [type="submit"], [type="reset"], [type="button"], [role="button"]).outline:hover:not(:disabled):not([aria-busy="true"]) {
  background-color:transparent;border-color:var(--color-accent);color:var(--color-primary);
}

/* A reset button is a secondary action by what the browser means by it, so it
   reads as one without a class. Specific enough to beat the base rule. */
[type="reset"] {
  background-color:var(--color-surface-raised);border-color:var(--color-border);color:var(--color-text);
}

/* The reset button's outline spends `.outline`'s tokens — see it for why the
   border must not repeat the label's. */
[type="reset"].outline {
  background-color:transparent;border-color:var(--color-accent);color:var(--color-primary);
}

[type="reset"].outline:hover:not(:disabled) {
  background-color:var(--color-primary);
  color:var(--color-on-primary);
}

/* ---------- icon slot ---------- */

/* 1em rather than a fixed size so the glyph tracks the button's font-size
   across all three sizes with no extra tokens. */
.button-icon {
  display: inline-block;
  flex: none;
  width: 1em;
  height: 1em;
  background-color: currentColor;
}

/* ---------- groups ---------- */

/* A joined control. Children lose their own radii and their adjacent borders
   are collapsed, so the group reads as one object with dividers rather than as
   several buttons that happen to touch. aria-pressed marks the active member
   so the selection is announced, not just drawn. */
span[role="group"] {
  display: inline-flex;
  align-items: stretch;
}

span[role="group"] > button {
  border-radius: 0;
  /* The seam collapses against the shared edge width every control reads —
     no utility expresses a calc. */
  margin-inline-start: calc(-1 * var(--border-width));
}

span[role="group"] > button:first-child {
  margin-inline-start: 0;
  border-start-start-radius:var(--radius-md);border-end-start-radius:var(--radius-md);
}

span[role="group"] > button:last-child {
  border-start-end-radius:var(--radius-md);border-end-end-radius:var(--radius-md);
}

/* Hover on one member must not swallow its neighbours' borders. */
span[role="group"] > button:hover {
  z-index: 1;
}

span[role="group"] > button[aria-pressed="true"] {
  background-color:var(--color-primary);
  color:var(--color-on-primary);
  border-color:var(--color-on-primary);
  z-index: 1;
}


/*
 * Semantic form elements.
 *
 * The contract is the element and the ARIA attribute, not a class. `<input>` is
 * a text field; `<input type="range">` is a slider; `<input type="search">` is a
 * search box. Authoring a class per input type is how form systems end up
 * fighting the markup.
 *
 * Markup contract:
 *   <input>                         text field — the default
 *   <input type="email">            email, with platform validation
 *   <input type="password">         masked text
 *   <input type="search">            search box, with platform clear button
 *   <input type="tel">              telephone, no spinner
 *   <input type="url">               URL, with platform validation
 *   <input type="number">           numeric, with stepper
 *   <input type="range">            slider — a value within a range
 *   <input type="checkbox">         binary choice
 *   <input type="radio">            one of a group
 *   <input type="checkbox" role="switch">  toggle — a checkbox that looks like a switch
 *   <input type="file">             file picker, with platform button
 *   <input type="color">            color swatch
 *   <input type="date">             date picker
 *   <select>                        dropdown of options
 *   <textarea>                      multi-line text
 *   <fieldset> + <legend>          groups related fields
 *   <label>                         names a field, clickable
 *   <small>                         helper text, sibling to a field
 *   aria-invalid="true"             failed validation — error color
 *   aria-invalid="false"            passed validation — success color
 *   aria-invalid                    unknown state — primary color
 *   fieldset[disabled]              disables all fields within
 *
 * Two kinds of value appear here:
 *
 *   spent bindings  The CSS names a scale step it consumes — `var(--radius-md)`,
 *                   `var(--spacing-2)`. No token is minted, because the author of
 *                   the CSS has no choice to express. A theme moves the field by
 *                   moving the scale.
 *
 *   character       A decision a theme genuinely owns — the disabled dim, the
 *                   percentage padding that keeps the validation icon clear of
 *                   the text. These are minted as `form.*` tokens because the
 *                   choice is real.
 *
 * States:
 *   :hover           file button and calendar indicator only — fields themselves
 *                    do not change on hover
 *   :active          not used — no pressed state for fields
 *   :focus           focus ring on text-like fields
 *   :focus-visible   focus ring on range, switch, and file button
 *   :disabled        dimmed, cursor not-allowed
 *   aria-invalid     moves the border to the matching semantic color
 *   :checked         for checkbox/radio — the platform's own indicator
 *
 * Motion:
 *   No transitions or keyframes. Form fields change state instantly — a focus
 *   ring appears, a border changes color — and there is no travel to animate.
 *   There is no reduced-motion block because there is no motion to reduce.
 *
 * ARIA + AT:
 *   A screen reader announces the label, the field type, and the current
 *   validity state. `aria-invalid` is the contract: it is what moves the border
 *   to the semantic color, so the visual state and the announced state are one
 *   thing. Helper text is announced as part of the field's description. A
 *   fieldset's legend is announced as the group's name. The disabled state is

  width:100%;transition-property:color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, translate, scale, rotate;transition-duration:var(--motion-duration-fast);transition-timing-function:var(--motion-easing-standard);border-width:1px;background-color:var(--color-surface-raised);border-color:var(--color-border);padding-left:var(--spacing-2);padding-right:var(--spacing-2);padding-top:var(--spacing-1);padding-bottom:var(--spacing-1);font-family:var(--font-family-sans);font-size:var(--font-size-md);color:var(--color-text);border-radius:var(--radius-md);

input[type="radio"] {
  cursor:pointer;accent-color:var(--color-primary);
  width: 1em;
  height: 1em;
  vertical-align: middle;
}

input[type="checkbox"]:disabled,

}

/* ---------- range ---------- */

input[type="range"] {
  cursor:pointer;accent-color:var(--color-primary);

}

/* ---------- search and file ---------- */

input[type="search"] {
  appearance: none;
}

}

/* ---------- color ---------- */

input[type="color"] {
  cursor:pointer;padding:var(--spacing-1);border-radius:var(--radius-sm);
  width: 2.5em;
  height: 2.5em;

/* ---------- range ---------- */

input[type="time"]::-webkit-calendar-picker-indicator:hover,
input[type="datetime-local"]::-webkit-calendar-picker-indicator:hover,

/*
 * Semantic content.
 *
 * Prose, tables and figures. The contract is the element: a `<table>` is a
 * table, `<code>` is code, `<blockquote>` is a quotation. The only class here is
 * `striped`, because a striped table is a real choice about density and there
 * is no element that expresses it.
 *
 * Markup contract:
 *   <h1>–<h6>                       headings, sized by the type scale
 *   <p>                             paragraph
 *   <ul>, <ol>, <li>                lists — unordered, ordered, item
 *   <dl>, <dt>, <dd>                definition list — term, definition
 *   <blockquote>, <footer>          quotation and its attribution
 *   <pre>, <code>, <kbd>, <samp>    code — block, inline, keyboard input, output
 *   <figure>, <figcaption>          media with a caption
 *   <img>, <video>, <canvas>, <svg>  media — raster, video, canvas, vector
 *   <table>, <caption>, <th>, <td>   table — with caption, header, cell
 *   <tfoot>                         table footer
 *   <hr>                            thematic break
 *   <a>                             link — the one piece of prose that is also a control
 *   <strong>, <b>                   bold
 *   <small>                         side comment
 *   <sub>, <sup>                    subscript, superscript
 *   <abbr[title]>                   abbreviation with expansion
 *   <mark>                          highlighted text
 *   <ins>, <del>                     insertion, deletion
 *   <iframe>, <embed>, <object>     embedded content
 *   table.striped                  alternating row backgrounds
 *
 * Two kinds of value appear here:
 *
 *   spent bindings  The CSS names a scale step it consumes — `var(--spacing-2)`,
 *                   `var(--radius-md)`, `var(--font-weight-bold)`. No token is
 *                   minted, because the author of the CSS has no choice to
 *                   express. A theme moves the prose by moving the scale.
 *
 *   character       None. Every value here is a scale step. A theme that wants
 *                   denser prose changes `spacing`, and every block moves with
 *                   it. Vertical rhythm is expressed in `em`, not `rem`, so it
 *                   tracks the element's own size — an `h1` and a `p` sit on the
 *                   same rhythm scaled to their type.
 *
 * States:
 *   :hover           links only — thicker underline
 *   :active          not used
 *   :focus-visible   links only — focus ring
 *   :disabled        not used — content is not interactive
 *   aria-current     not used — no navigation state in content
 *
 * Motion:
 *   No transitions or keyframes. Content is static — it does not move, so there
 *   is nothing to animate and no reduced-motion block.
 *
 * ARIA + AT:
 *   A screen reader navigates content by structure: headings are landmarks,
 *   lists are announced with their item count, tables are announced with their
 *   caption and header associations. The `abbr[title]` expansion is read in full.
 *   `mark` is announced as highlighted. `ins` and `del` are announced as
 *   insertions and deletions. Links are announced with their href. Images need
 *   `alt` text to be in the a11y tree — the CSS does not create it, but the
 *   radius and border treatment assume it is there.
 */

/* ---------- rhythm ---------- */

/* Headings, lists and figures share one vertical beat. Proportional to the
   element's type size, so the rhythm holds at every scale. */
h1,
h2,
h3,
h4,
h5,
h6,
p,
ul,
ol,
dl,
blockquote,
pre,
table,
figure {

}

    var(--font-family-sans)));

  line-height: 1.2;
  letter-spacing: -0.02em;
}

h2 {
  /* font-family: heading → body → sans fallback chain is composite, not a single scale step. */
  font-family: var(--font-family-heading, var(--font-family-body,
    var(--font-family-sans)));
  font-weight:var(--font-weight-semibold);font-size:var(--font-size-2xl);
  line-height: 1.3;
  letter-spacing: -0.01em;
}

h3 {
  /* font-family: heading → body → sans fallback chain is composite, not a single scale step. */
  font-family: var(--font-family-heading, var(--font-family-body,
    var(--font-family-sans)));
  font-weight:var(--font-weight-semibold);font-size:var(--font-size-xl);
  line-height: 1.4;
}

h4 {
  /* font-family: heading → body → sans fallback chain is composite, not a single scale step. */
  font-family: var(--font-family-heading, var(--font-family-body,
    var(--font-family-sans)));
  font-weight:var(--font-weight-semibold);font-size:var(--font-size-lg);
  line-height: 1.4;
}

h5,
h6 {
  /* font-family: heading → body → sans fallback chain is composite, not a single scale step. */
  font-family: var(--font-family-heading, var(--font-family-body,
    var(--font-family-sans)));
  font-weight:var(--font-weight-semibold);font-size:var(--font-size-md);
  line-height: 1.5;
}

/* The gap above a heading is what makes it read as a heading; the gap below is
   what makes it read as attached to what follows. */
h1,
h2,
h3,
h4,
h5,
h6 {
  margin-block-start: var(--spacing-4);
}

h1 {
  margin-block-end: var(--spacing-4);
}

/* ---------- document ---------- */

/* The page itself. A theme owns these four values and nothing else about the
   document, which is why they are the base of the whole layer. */
body {
  /* font-family: body → sans fallback chain is composite, not a single scale step. */
  font-family: var(--font-family-body, var(--font-family-sans));
  font-size:var(--font-size-md);
  line-height: 1.5;
  background-color:var(--color-surface);color:var(--color-text);
  margin: 0;
}

/* ---------- link ---------- */

/* A link is the one piece of prose that is also a control, so it carries the
   brand color and a visible underline by default. Underlining prose links is
   the accessible default; the color alone is not enough to find one. */
a {
  color:var(--color-link);
  text-decoration: underline;
  text-underline-offset: 0.2em;
}

a:hover {
  text-decoration-thickness: 2;
}

a:focus-visible {
  outline: var(--focus-width) solid var(--color-focus-ring);
  outline-offset: var(--focus-offset);
  border-radius:var(--radius-sm);
}

/* ---------- inline ---------- */

strong,
b {
  font-weight:var(--font-weight-bold);
}

small {
  font-size:var(--font-size-xs);color:var(--color-text-muted);
}

sub,
sup {
  font-size:var(--font-size-xs);
}

abbr[title] {
  text-decoration: underline dotted;
  cursor: help;
}

mark {
  padding: 0 calc(var(--spacing-1) / 2);
  background-color:var(--color-accent);color:var(--color-surface);
}

ins {
  text-decoration: underline;
  color:var(--color-semantic-success);
}

del {
  text-decoration: line-through;
  color:var(--color-semantic-error);
}

/* ---------- lists ---------- */

ul,
ol {
  padding-inline-start: var(--spacing-4);
}

li + li {
  margin-block-start: var(--spacing-1);
}

dt {
  font-weight:var(--font-weight-semibold);
}

dd {
  margin-inline-start: var(--spacing-4);
}

/* ---------- quote ---------- */

blockquote {
  padding: var(--spacing-2) var(--spacing-4);
  border-inline-start: var(--border-width) solid var(--color-border);
  color:var(--color-text-muted);
}

blockquote footer {
  margin-block-start: var(--spacing-1);
  font-size:var(--font-size-sm);
}

/* ---------- rule ---------- */

hr {
  height: 0;
  margin-block: var(--spacing-4);
  border: 0;
  border-block-start: var(--border-width) solid var(--color-border);
}

/* ---------- code ---------- */

code,
kbd,
samp,
pre {
  /* font-family: mono → system fallback chain is composite, not a single scale step. */
  font-family: var(--font-family-mono, ui-monospace, SFMono-Regular, Menlo,
    Consolas, monospace);
  font-size:var(--font-size-sm);
}

code {
  padding: calc(var(--spacing-1) / 2) var(--spacing-1);
  background-color:var(--color-surface);color:var(--color-text);border-radius:var(--radius-sm);
}

pre {
  padding: var(--spacing-2) var(--spacing-4);
  background-color:var(--color-surface);color:var(--color-text);border-radius:var(--radius-md);
  line-height: 1.5;
  overflow-x: auto;
}

/* A code block is not a stack of inline chips. */
pre code {
  padding: 0;
  background-color: transparent;
}

kbd {
  padding: calc(var(--spacing-1) / 2) var(--spacing-1);
  border: var(--border-width) solid var(--color-border);
  border-block-end-width: calc(var(--border-width) * 2);
  background-color:var(--color-surface-raised);color:var(--color-text);font-size:var(--font-size-xs);border-radius:var(--radius-sm);
  white-space: nowrap;
}

/* ---------- figure ---------- */

figure {
  margin-inline: 0;
}

figcaption {
  margin-block-start: var(--spacing-1);
  text-align:center;font-size:var(--font-size-sm);color:var(--color-text-muted);
}

/* ---------- media ---------- */

img,
video,
canvas,
svg {
  display: block;
  max-width: 100%;
  height: auto;
}

img,
video {
  border-radius:var(--radius-md);
}

/* ---------- table ---------- */

table {
  width: 100%;
  border-collapse: collapse;
  font-size:var(--font-size-sm);
}

  padding-block-end: var(--spacing-1);
  text-align:left;color:var(--color-text-muted);
}

th,
td {
  padding: var(--spacing-1) var(--spacing-2);
  border-block-end: var(--border-width) solid var(--color-border);
  text-align: left;
}

  font-weight:var(--font-weight-semibold);
}

  border-block-start: var(--border-width) solid var(--color-border);
  border-block-end: 0;
  font-weight:var(--font-weight-semibold);
}

   expresses "every other row". */
table.striped tbody tr:nth-of-type(odd) {
  background-color:var(--color-surface-raised);
}

embed,

  display: block;
  max-width: 100%;
  border: var(--border-width) solid var(--color-border);
  border-radius:var(--radius-md);
}


/*
 * Semantic disclosure and dialog.
 *
 * Two components, one reason they belong together: the platform provides both.
 * `<details>` is a disclosure widget and `<dialog>` is a modal, and neither
 * needs JavaScript to be usable or accessible. That is the entire argument for
 * styling them here rather than shipping a headless component library — the
 * behaviour, the focus handling and the semantics are already in the browser.
 *
 * Markup contract:
 *   <details>                       disclosure widget — closed by default
 *   <details open>                  disclosure widget — open
 *   <details> > <summary>           the label and toggle, always visible
 *   <details> > *:not(summary)      the collapsible body
 *   <dialog>                        modal — hidden by default
 *   <dialog open>                   modal — visible, with backdrop
 *   dialog::backdrop                the veil behind the modal
 *
 * Two kinds of value appear here:
 *
 *   spent bindings  The CSS names a scale step it consumes — `var(--spacing-4)`,
 *                   `var(--spacing-2)`, `var(--motion-duration-fast)`. No token is
 *                   minted, because the author of the CSS has no choice to
 *                   express. A theme moves the disclosure by moving the scale.
 *
 *   character       None. The one value a theme states is how long the chevron
 *                   takes to turn, and even that spends `motion.duration.fast`;
 *                   a theme with no motion preference gets it from the
 *                   reduced-motion block below rather than from a token.
 *
 * States:
 *   :hover           summary only — surface background
 *   :active          not used — no pressed state
 *   :focus-visible   summary only — focus ring
 *   :disabled        not used — disclosure has no disabled state
 *   [open]           the open state — chevron rotates, body is visible
 *
 * Motion:
 *   The chevron rotates on open, spending `motion.duration.fast`. The dialog
 *   entrance is a scale-and-fade from just below full size via `@starting-style`
 *   and `dialog-in` from `@spin/animation`; the backdrop fades in via `backdrop-in`.
 *   `allow-discrete` lets the transition run on the way out too. The
 *   reduced-motion block below turns all of it off.
 *
 * ARIA + AT:
 *   A screen reader announces a disclosure as a button that expands or collapses
 *   a region. The `open` state is announced. A dialog is announced as a modal
 *   dialog, and focus is trapped inside it while it is open. The backdrop is
 *   presentational — it must stay out of the a11y tree. The dialog's own heading
 *   and body share the page rhythm, so a dialog reads as a page fragment.
 */

/* ---------- disclosure ---------- */

details {
  border-width:1px;background-color:var(--color-surface-raised);border-color:var(--color-border);margin-top:var(--spacing-2);margin-bottom:var(--spacing-2);border-radius:var(--radius-md);
}

details > summary {
  /* The summary is a row, so the chevron and the label sit on one line with a
     single gap however long the label is. */
  display: flex;
  align-items: center;
  cursor: pointer;
  list-style: none;
  transition-duration:var(--motion-duration-fast);transition-timing-function:var(--motion-easing-standard);padding-left:var(--spacing-4);padding-right:var(--spacing-4);padding-top:var(--spacing-2);padding-bottom:var(--spacing-2);gap:var(--spacing-2);font-weight:var(--font-weight-semibold);color:var(--color-text);border-radius:var(--radius-md);
}

/* The disclosure triangle is the browser's, and it cannot be styled into a
   chevron consistently across engines, so it is removed and the rotation is
   drawn instead. */
details > summary::-webkit-details-marker {
  display: none;
}

details > summary::marker {
  content: "";
}

/* The chevron: a border pair rotated on the inline axis, so it costs no image
   and inherits the label's color. */
details > summary::after {
  content: "";
  flex: none;
  width: 0.5em;
  height: 0.5em;
  margin-inline-start: auto;
  border-block-end: 2px solid currentColor;
  border-inline-end: 2px solid currentColor;
  transform: rotate(-45deg);
  transition-duration:var(--motion-duration-fast);transition-timing-function:var(--motion-easing-standard);
}

details[open] > summary::after {
  transform: rotate(45deg);
}

details > summary:hover {
  background-color:var(--color-surface);
}

details > summary:focus-visible {
  outline: var(--border-width) solid var(--color-focus-ring);
  outline-offset: calc(-1 * var(--border-width));
}

details > *:not(summary) {
  padding-left:var(--spacing-4);padding-right:var(--spacing-4);padding-bottom:var(--spacing-2);
}

/* ---------- dialog ---------- */

dialog {
  /* A dialog is centered in the viewport and sized to its content, and the
     backdrop is the platform's, so there is no wrapper element to invent. */
  max-width: min(32rem, calc(100vw - 2 * var(--spacing-4)));
  max-height: calc(100vh - 2 * var(--spacing-4));
  overflow: auto;
  border-width:1px;background-color:var(--color-surface-raised);border-color:var(--color-border);padding:var(--spacing-4);color:var(--color-text);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
}

/* The backdrop is a pseudo-element because the platform gives the dialog
   nothing to paint one on. It spends the text color at a low alpha, so a theme
   that inverts light and dark inverts the veil too. */
dialog::backdrop {
  background-color: color-mix(in oklab, var(--color-text) 50%, transparent);
}

dialog:not([open]) {
  display: none;
}

/* The entrance is a scale-and-fade from just below full size, which reads as
   the dialog arriving rather than appearing. `allow-discrete` lets the
   transition run on the way out too, which a dialog otherwise skips. The
   `dialog-in` and `backdrop-in` keyframes are owned by `@spin/animation`. */
dialog[open] {
  animation: dialog-in var(--motion-duration-base)
    var(--motion-easing-decelerate);
}

dialog[open]::backdrop {
  animation: backdrop-in var(--motion-duration-base)
    var(--motion-easing-decelerate);
}

@starting-style {
  dialog[open] {
    transform: translateY(0.5rem) scale(0.98);
    opacity:0;
  }

  dialog[open]::backdrop {
    opacity:0;
  }
}

/* A dialog's own heading and body share the page rhythm rather than carrying
   their own spacing, so a dialog reads as a page fragment. */
dialog h1,
dialog h2,
dialog h3 {
  margin-block-start: 0;
}

/* ---------- reduced motion ---------- */

/* Motion is decoration. Someone who has asked the platform to stop it gets the
   state change without the travel. */
@media (prefers-reduced-motion: reduce) {
  details > summary,
  details > summary::after,
  dialog[open],
  dialog[open]::backdrop {
    transition-property:none;animation:none;
  }
}


/*
 * Semantic layout.
 *
 * A container and the landmarks. The contract is the element, because that is
 * what a document actually is: `<main>` is the main region, `<nav>` is
 * navigation, and a reader or a screen reader navigates by those names rather
 * than by anything a stylesheet invents.
 *
 * Markup contract:
 *   <body>                          the page — one column by default
 *   <main>                          the main content region
 *   <section>                       a thematic grouping
 *   <article>                       a self-contained composition
 *   <header>                        introductory content
 *   <footer>                        closing content
 *   <nav>                           navigation landmark
 *   <aside>                         complementary content
 *   .container                     caps the column at 80ch, centers it
 *   .container-fluid               full width, gutters only
 *   .overflow-auto                  scrolls its own content
 *
 * Two kinds of value appear here:
 *
 *   spent bindings  The CSS names a scale step it consumes — `var(--spacing-4)`
 *                   for gutters, `1rem` for the measure. No token is minted,
 *                   because the author of the CSS has no choice to express. A
 *                   theme moves the container by moving the scale.
 *
 *   character       None. A container is a width, and every theme would set the
 *                   same maximum — so the width is spent from a `rem` measure
 *                   rather than minted. What a theme *can* change is the gutters,
 *                   and because those are spent it changes them for every
 *                   container at once.
 *
 * States:
 *   :hover           not used — layout is not interactive
 *   :active          not used
 *   :focus-visible   not used — landmarks do not take focus
 *   :disabled        not used
 *   aria-current     not used — no navigation state in layout
 *
 * Motion:
 *   No transitions or keyframes. Layout is static — it does not move, so there
 *   is nothing to animate and no reduced-motion block.
 *
 * ARIA + AT:
 *   A screen reader navigates by landmark: `<main>`, `<nav>`, `<header>`,
 *   `<footer>`, `<aside>` are all landmark regions. `<section>` and `<article>`
 *   are regions when they have an accessible name. The container and overflow
 *   classes are presentational — they must stay out of the a11y tree. The
 *   grid gutter is a custom property consumed by the utility layer, not an
 *   ARIA concern.
 */

/* ---------- landmarks ---------- */

body {
  /* The page is one column by default. A grid is not imposed: content decides
     its own width, and a container decides where it may grow. */
  display: block;
}

main,
section,
article,
header,
footer,
nav,
aside {
  display: block;
}

/* ---------- container ---------- */

/* The measure. Long lines are hard to read, so a container caps the column and
   the gutters come off the spacing scale. A theme that wants a wider measure
   changes `spacing`, not the container. */
.container,
.container-fluid {
  width:100%;margin-left:auto;margin-right:auto;padding-left:var(--spacing-4);padding-right:var(--spacing-4);
}

.container {
  max-width: calc(80 * 1rem);
}

/* ---------- section rhythm ---------- */

/* Block-level regions stack on the spacing scale, so vertical rhythm is one
   decision rather than a margin on every section. */
section + section,
article + article {
  margin-top:var(--spacing-4);
}

/* ---------- overflow ---------- */

/* A region that scrolls says so on the element rather than through a class, so
   the affordance travels with the markup. */
.overflow-auto {
  overflow: auto;
  /* Momentum scrolling is a platform decision, not a theme one. */
  overscroll-behavior: contain;
}

/* ---------- grid gutters ---------- */

/* The one thing a theme owns about a layout grid: the gap between cells. A
   container and a grid share it, so a page's horizontal rhythm is one
   decision — and a grid that does not set its own gap inherits this rather
   than falling back to zero.

   Track *shape* is not a theme decision: how many columns, how wide, how they
   flow are `grid-cols-*` and friends in the utility layer. Only the space
   between them is design. */
.container,
.container-fluid {
  --grid-gutter: var(--spacing-4);
}


/*
 * Semantic navigation.
 *
 * `nav` is a landmark, so it is styled as one: a labelled region with the
 * spacing of a block, and nothing that changes where it sits. What a nav *is*
 * — a list of links, a set of tabs, a breadcrumb trail — is expressed by the
 * markup inside it, not by a class on the landmark.
 *
 * Markup contract:
 *   <nav>                           navigation landmark
 *   <nav> > ul > li > a             a list of links
 *   <nav> > ol > li > a             a breadcrumb trail (ordered list)
 *   nav[aria-label="breadcrumb"]    breadcrumb variant — separated, not listed
 *   nav [aria-current]              the current page — announced and styled
 *
 * Two kinds of value appear here:
 *
 *   spent bindings  The CSS names a scale step it consumes — `var(--spacing-1)`,
 *                   `var(--spacing-4)`, `var(--font-weight-semibold)`. No token is
 *                   minted, because the author of the CSS has no choice to
 *                   express. A theme moves the nav by moving the scale.
 *
 *   character       None. The nav is a landmark with spacing from the scale and
 *                   weight from the type scale. What a nav *is* is expressed by
 *                   the markup inside it, not by a token.
 *
 * States:
 *   :hover           links only — underline
 *   :active          not used
 *   :focus-visible   links only — focus ring from the content layer
 *   :disabled        not used — nav items are links, not controls
 *   aria-current     the current page — color, weight, and underline
 *
 * Motion:
 *   No transitions or keyframes. Navigation is static — it does not move, so
 *   there is nothing to animate and no reduced-motion block.
 *
 * ARIA + AT:
 *   A screen reader announces a nav as a navigation landmark. The current page
 *   is announced via `aria-current`, and the styling keys off it too, so the
 *   visual state and the announced state are one thing. A breadcrumb is
 *   announced as a navigation landmark with the label "breadcrumb". The
 *   separator `/` is presentational — it must stay out of the a11y tree. The
 *   grid itself is deliberately not part of this layer: a layout grid is a
 *   decision every theme would answer differently, so it belongs to the utility
 *   layer.
 */

/* ---------- nav ---------- */

nav {
  display: block;
}

nav ul {
  display: flex;
  flex-wrap: wrap;
  list-style: none;
  margin-top:var(--spacing-0);margin-bottom:var(--spacing-0);padding-inline-start:var(--spacing-0);column-gap:var(--spacing-4);row-gap:var(--spacing-1);
}

/* A nav item is a link, so it inherits link treatment and gets the focus ring
   from the content layer rather than a second definition. */
nav a {
  text-decoration: none;
}

nav a:hover {
  text-decoration: underline;
}

/* The current page. `aria-current` is the state, and it is the one a screen
   reader announces, so the styling keys off it too. */
nav [aria-current]:not([aria-current="false"]) {
  text-decoration:underline;font-weight:var(--font-weight-semibold);color:var(--color-text);
}

/* A breadcrumb is a nav whose items are separated rather than listed. */
nav[aria-label="breadcrumb"] ol {
  display: flex;
  flex-wrap: wrap;
  list-style: none;
  margin-top:var(--spacing-0);margin-bottom:var(--spacing-0);padding-inline-start:var(--spacing-0);column-gap:var(--spacing-2);row-gap:var(--spacing-1);
}

nav[aria-label="breadcrumb"] li + li::before {
  content: "/";
  color:var(--color-text-muted);margin-inline-end:var(--spacing-2);
}


/*
 * Semantic navigation, grouping and disclosure overlays.
 *
 * The contract is the ARIA role, because a role is what a screen reader
 * navigates by. `role="group"` is a set of related controls; `role="search"` is
 * the same shape with rounded ends; `[data-tooltip]` is a label for something
 * that has no room for a visible one.
 *
 * A group is the one place where a component reaches into another: a joined
 * control has to flatten its children's radii and lift a focused child above
 * its siblings' borders. That is a relationship, and CSS has no other way to
 * express one, so it lives here rather than being pushed into the button.
 *
 * Markup contract:
 *   <div role="group">                a row of related controls that reads as one
 *                                     object; children's corners flatten and
 *                                     adjacent borders collapse into seams
 *   <form role="search">               the same shape as a pill — the field is the
 *                                     face, the submit button is chrome on the end
 *   <button data-tooltip="…">          reveals a label on hover or focus
 *   <button data-tooltip data-placement="top|bottom|left|right">
 *                                     placement is the author's call; they know
 *                                     where the room is
 *
 * Theming — spent, never character. The two kinds of value a primitive can hold
 * are a spent binding (a scale step the CSS consumes; no token is minted, because
 * the author has no choice to express) and character (a decision a theme owns,
 * minted as a token because the choice is real). This file holds only spent
 * bindings: `--border-width` for the seam between joined children and the
 * tooltip's edge, `--spacing-*` for the tooltip's padding and offsets. The
 * radii are scale steps, so they are spent as `rounded-*` utilities rather
 * than declarations. No token is minted, because there is no decision here a
 * theme would answer differently — a group is a relationship between controls,
 * not a surface with its own look.
 *
 * States + ARIA equivalents:
 *   :focus-visible on a child         lifts it above the seam so the focus ring is
 *                                     never cut by a neighbour's border
 *   :hover / :focus-visible            reveals the tooltip — the states that mean
 *                                     "this has a description you want"
 *   A group or search region has no disabled or pressed state of its own; the
 *   controls inside them carry those.
 *
 * Motion + prefers-reduced-motion:
 *   The tooltip fades in over `--motion-duration-fast`. `@media
 *   (prefers-reduced-motion: reduce)` drops the transition, so the label appears
 *   instantly — a transition on something that exists to be read is decoration,
 *   not feedback.
 *
 * ARIA + AT announcements:
 *   A group is announced as a unit — "group", with its children as controls.
 *   `role="search"` is a landmark, so a screen reader can jump straight to it.
 *   The tooltip is a pseudo-element, so it is read as the element's own
 *   description: no live region, no extra node, nothing to keep in sync.
 */

/* ---------- group ---------- */

/* A row of related controls that reads as one object. Children drop their own
   corners and their adjacent borders collapse, so the dividers between them
   read as seams rather than as four separate controls. */
[role="group"],
[role="search"] {
  width:100%;display:inline-flex;position:relative;border-radius:var(--radius-md);
  vertical-align: middle;
}

[role="group"] > *,
[role="search"] > * {
  flex:1 1 auto;position:relative;border-radius:var(--radius-none);
}

[role="group"] > :first-child,
[role="search"] > :first-child {
  border-start-start-radius:var(--radius-md);border-end-start-radius:var(--radius-md);
}

[role="group"] > :last-child,
[role="search"] > :last-child {
  border-start-end-radius:var(--radius-md);border-end-end-radius:var(--radius-md);
}

/* The collapse is the group's own border width, so a theme that thickens its
   borders thickens the seam by the same amount. */
[role="group"] > * + *,
[role="search"] > * + * {
  /* The seam reads the `--border-width` a joined control collapses against
     (button geometry), and no utility emits a logical margin or that token. */
  margin-inline-start: calc(-1 * var(--border-width));
}

/* A focus ring has to sit above its neighbours or the seam cuts through it. */
[role="group"] > *:focus-visible,
[role="search"] > *:focus-visible {
  /* No `z-*` utility for 1: the scale steps are `base`, `dropdown`, `modal`,
     `toast`. */
  z-index: 1;
}

/* A search region reads as one pill: the field is its face and the submit is
   chrome on the end. The field loses its own border because the group's
   provides it; the button keeps its own treatment, or a search pill would
   have no visible way to submit. */
[role="search"] {
  border-radius:var(--radius-full);
}

[role="search"] > :not(:is(button, [type="submit"], [role="button"])) {
  border-width:0;background-color:transparent;
}

[role="search"] > :not(:is(button, [type="submit"], [role="button"])):focus-visible {
  /* The ring's width is the shared `--focus-width` token, which the outline
     utilities do not carry. */
  outline: var(--focus-width) solid var(--color-focus-ring);
  /* The offset is derived from that same width, so it cannot be a scale
     step. */
  outline-offset: calc(-1 * var(--focus-width));
}

/* ---------- tooltip ---------- */

/* A tooltip is a label the element cannot show, declared with a data attribute
   and revealed on hover or focus. It is a pseudo-element because there is no
   second element in the markup, and it is positioned in the inline axis so it
   never needs a measurement. */
[data-tooltip] {
  position:relative;
}

[data-tooltip]::after {
  content: attr(data-tooltip);
  position:absolute;
  /* No `z-*` utility for 1: the scale steps are `base`, `dropdown`, `modal`,
     `toast`. */
  z-index: 1;
  /* Logical insets and the translate have no utility — the inset rules write
     physical sides — and the offset is derived from the spacing scale. */
  inset-block-end: calc(100% + var(--spacing-1));
  inset-inline-start: 50%;
  translate: -50% 0;
  /* Padding stays logical, as it does in the button: `py-1 px-2` would write
     physical sides for a surface whose placement follows the writing mode. */
  padding: var(--spacing-1) var(--spacing-2);
  /* The edge width reads the shared `--border-width` token, which no utility
     reads; the style and colour are utilities. */
  border-width: var(--border-width);
  border-style:solid;border-color:var(--color-border);border-radius:var(--radius-sm);
  opacity:0;white-space:nowrap;pointer-events:none;background-color:var(--color-text);color:var(--color-surface);font-size:var(--font-size-xs);
  transition-property:opacity;transition-duration:var(--motion-duration-fast);transition-timing-function:var(--motion-easing-standard);
  line-height: 1.4;
}

/* Shown on the states that mean "this has a description you want". */
[data-tooltip]:is(:hover, :focus-visible)::after {
  opacity:1;
}

/* Placement is a data attribute because the author knows where the room is. */
[data-tooltip][data-placement="top"]::after {
  /* Placement is logical and derived from the spacing scale; no utility
     writes a logical inset. */
  inset-block-end: auto;
  inset-block-start: calc(100% + var(--spacing-1));
}

[data-tooltip][data-placement="bottom"]::after {
  /* Placement is logical and derived from the spacing scale; no utility
     writes a logical inset. */
  inset-block-start: auto;
  inset-block-end: calc(100% + var(--spacing-1));
}

[data-tooltip][data-placement="left"]::after {
  /* Placement is logical and derived from the spacing scale; no utility
     writes a logical inset. */
  inset-block-end: auto;
  inset-block-start: 50%;
  inset-inline-start: auto;
  inset-inline-end: calc(100% + var(--spacing-1));
  translate: 0 -50%;
}

[data-tooltip][data-placement="right"]::after {
  /* Placement is logical and derived from the spacing scale; no utility
     writes a logical inset. */
  inset-block-end: auto;
  inset-block-start: 50%;
  inset-inline-start: calc(100% + var(--spacing-1));
  inset-inline-end: auto;
  translate: 0 -50%;
}

@media (prefers-reduced-motion: reduce) {
  [data-tooltip]::after {
    transition-property:none;
  }
}


/*
 * Semantic feedback and accessibility.
 *
 * Three small surfaces that have one thing in common: they are all states
 * rather than components, expressed through ARIA so the browser and assistive
 * technology agree about what is happening without a class.
 *
 *   progress     the element, with the platform's own value semantics
 *   loading      `[aria-busy="true"]` draws a spinner in the content box
 *   a11y         cursor and hiding behaviour that follow state, not class
 *
 * Markup contract:
 *   <progress>                         determinate, with a value the platform
 *                                     announces; `:indeterminate` when the value
 *                                     is not yet known
 *   <div aria-busy="true">             draws a spinner in the content box and holds
 *                                     its width so a list does not reflow as each
 *                                     row resolves
 *   <button aria-busy="true">          takes no input while busy — one declaration,
 *                                     not a disabled class
 *   <div aria-controls="…">            cursor follows operability
 *   <div aria-disabled="true">         not-allowed cursor, the ARIA equivalent of
 *                                     `[disabled]`
 *   <div aria-hidden="false" hidden>   opts back into the accessibility tree
 *   .visually-hidden                   the class for when there is no such element
 *   <div dir="rtl">                    direction is content; the theme follows it
 *
 * Theming — spent, never character. The two kinds of value a primitive can hold
 * are a spent binding (a scale step the CSS consumes; no token is minted, because
 * the author has no choice to express) and character (a decision a theme owns,
 * minted as a token because the choice is real). This file holds only spent
 * bindings: `--spacing-2` for the spinner's gap, the motion scale for its speed.
 * The one thing that might be worth a token is a spinner's speed, and even that
 * is spent, so a theme with slow motion gets a slow spinner rather than a wrong
 * one. The visually-hidden recipe is fixed at `1px` — a value a theme may not
 * restate. No token is minted anywhere in this file.
 *
 * States + ARIA equivalents:
 *   :indeterminate on `progress`       the value is not yet known; a gradient
 *                                     slides across the track with no JS
 *   `[aria-busy="true"]`              loading — spinner, held width, and
 *                                     `pointer-events: none` on controls
 *   `[aria-disabled="true"]`          not-allowed cursor, the ARIA equivalent of
 *                                     `[disabled]`
 *   `[aria-hidden="false"][hidden]`    visible again, and still keyboard-reachable
 *
 * Motion + prefers-reduced-motion:
 *   Two animations live here — the indeterminate progress sweep and the busy
 *   spinner. `@media (prefers-reduced-motion: reduce)` turns every animation
 *   this layer owns off in a single block, so the preference covers all of them
 *   rather than each being remembered separately.
 *
 * ARIA + AT announcements:
 *   `progress` carries the platform's own value semantics, so its percentage is
 *   announced without a live region. `aria-busy` tells assistive technology that
 *   a region is updating and will announce when it settles. The spinner is a
 *   `::before` pseudo-element, so it is read as part of the region itself — no
 *   extra node, nothing to keep in sync.
 */

/* ---------- progress ---------- */

progress {
  /* The platform reads `color` for the filled portion, which is why a progress
     bar needs both properties to render consistently across engines. */
  width:100%;display:block;overflow:hidden;border-width:0;background-color:var(--color-surface-raised);height:var(--spacing-1);color:var(--color-primary);border-radius:var(--radius-full);
  /* Logical margin: no utility writes `margin-block-end`. */
  margin-block-end: var(--spacing-2);
  appearance: none;
}

progress::-webkit-progress-bar {
  border-radius:var(--radius-full);
  background: none;
}

progress::-webkit-progress-value {
  transition-duration:var(--motion-duration-base);transition-timing-function:var(--motion-easing-standard);background-color:var(--color-primary);border-radius:var(--radius-full);
  /* `inline-size` is not in the transition-property vocabulary, so the
     property stays a declaration. */
  transition-property: inline-size;
}

progress::-moz-progress-bar {
  background-color:var(--color-primary);border-radius:var(--radius-full);
}

/* Indeterminate: a value that is not yet known. The bar is a gradient sliding
   across the track, which needs no JavaScript and no extra element. */
progress:indeterminate {
  /* The sweep is a gradient positioned and sized by hand — no utility covers
     `background-position` or `background-size` — so the declaration stays. */
  background:
    linear-gradient(
    to right,
    var(--color-primary) 30%,
    var(--color-surface-raised) 30%
  )
    top left / 150% 150% no-repeat;
  animation: progress-indeterminate 1.5s linear infinite;
}

progress:indeterminate::-webkit-progress-value,
progress:indeterminate::-moz-progress-bar {
  background-color: transparent;
}

/* ---------- loading ---------- */

/* A busy region shows a spinner in place of whatever the content will be, and
   holds its width so a list does not reflow as each row resolves. The spin is
   the same border trick the button uses, so it inherits currentColor.

   What the exclusion list owns: button.css draws its own `::after` spinner
   for everything it claims as a control — the `button` element and anything
   with `role="button"]` — so a busy control must get one spinner, not one
   from each layer. The three legacy input types need no entry of their own:
   the bare `input` above already covers every type, and a replaced element
   renders no pseudo-elements anyway. */
[aria-busy="true"]:not(:is(input, select, textarea, html, form, button, [role="button"])) {
  white-space:nowrap;
}

[aria-busy="true"]:not(:is(input, select, textarea, html, form, button, [role="button"]))::before {
  content: "";
  display: inline-block;
  width: 1em;
  height: 1em;
  flex: none;
  border: 2px solid currentColor;
  border-block-start-color: transparent;
  border-radius: 50%;
  vertical-align: -0.125em;
  /* The spin duration is the fast step times four — a derived value — and
     the preset has no `animate-*` utility at all. */
  animation: spin calc(var(--motion-duration-fast) * 4) linear infinite;
}

[aria-busy="true"]:not(:is(input, select, textarea, html, form, button, [role="button"])):not(:empty)::before {
  /* Logical margin: no utility writes `margin-inline-end`. */
  margin-inline-end: var(--spacing-2);
}

   spacing rather than the two stacked rules above. */

/* ---------- checkbox and radio ---------- */

input[type="checkbox"],

  cursor:pointer;accent-color:var(--color-primary);
  width: 1em;
  height: 1em;
  vertical-align: middle;
}

input[type="checkbox"]:disabled,

  cursor:not-allowed;
}

/* ---------- range ---------- */

input[type="range"] {
  cursor:pointer;accent-color:var(--color-primary);
  height: 1.5em;
}

/* ---------- search and file ---------- */

input[type="search"] {
  appearance: none;
}

  appearance: none;
}

/* ---------- color ---------- */

input[type="color"] {
  cursor:pointer;padding:var(--spacing-1);border-radius:var(--radius-sm);
  width: 2.5em;
  height: 2.5em;

/* ---------- range ---------- */

/* The track and thumb are the platform's, tinted with the same accent the rest
   of the form uses, so a slider matches the fields beside it without any
   vendor-specific track painting. */

  cursor:pointer;border-width:0;background-color:transparent;accent-color:var(--color-primary);
  height: 1.5em;

     outline-offset from --focus-offset. */

  outline-offset: var(--focus-offset);

  opacity:0.55;cursor:not-allowed;

/* A file field is a label wrapped around the platform's own button. The button

   color, which is what separates the two without an extra element. */

  cursor:pointer;border-width:0;padding:var(--spacing-0);color:var(--color-text-muted);
  background: none;

  transition-property:color, background-color, border-color, text-decoration-color, fill, stroke;transition-duration:var(--motion-duration-fast);transition-timing-function:var(--motion-easing-standard);cursor:pointer;border-width:1px;background-color:var(--color-surface-raised);border-color:var(--color-border);margin-inline-end:var(--spacing-2);padding-left:var(--spacing-2);padding-right:var(--spacing-2);padding-top:var(--spacing-1);padding-bottom:var(--spacing-1);font-weight:var(--font-weight-medium);color:var(--color-text);font-size:var(--font-size-sm);border-radius:var(--radius-md);

}

  /* No utility expresses an outline from --focus-width and a colour, nor an
     outline-offset from --focus-offset. */
  outline: var(--focus-width) solid var(--color-focus-ring);
  outline-offset: var(--focus-offset);
}

input[type="file"]:disabled::file-selector-button {
  opacity:0.55;cursor:not-allowed;
}

/* ---------- date ---------- */

/* The calendar and clock affordances are the platform's. They are tinted with
   the page's own colors so a date field does not arrive with a white picker in
   a dark form. */
input[type="date"],
input[type="time"],
input[type="datetime-local"],
input[type="month"],
input[type="week"] {
  accent-color:var(--color-primary);
  color-scheme: light dark;
}

input[type="date"]::-webkit-calendar-picker-indicator,
input[type="time"]::-webkit-calendar-picker-indicator,
input[type="datetime-local"]::-webkit-calendar-picker-indicator,
input[type="month"]::-webkit-calendar-picker-indicator,
input[type="week"]::-webkit-calendar-picker-indicator {
  opacity:1;cursor:pointer;border-width:0;background-color:transparent;padding:var(--spacing-0);color:var(--color-text-muted);border-radius:var(--radius-sm);
}

input[type="date"]::-webkit-calendar-picker-indicator:hover,
input[type="time"]::-webkit-calendar-picker-indicator:hover,
input[type="datetime-local"]::-webkit-calendar-picker-indicator:hover,
input[type="month"]::-webkit-calendar-picker-indicator:hover,
input[type="week"]::-webkit-calendar-picker-indicator:hover {
  color:var(--color-text);
}


/*
 * Semantic content.
 *
 * Prose, tables and figures. The contract is the element: a `<table>` is a
 * table, `<code>` is code, `<blockquote>` is a quotation. The only class here is
 * `striped`, because a striped table is a real choice about density and there
 * is no element that expresses it.
 *
 * Markup contract:
 *   <h1>–<h6>                       headings, sized by the type scale
 *   <p>                             paragraph
 *   <ul>, <ol>, <li>                lists — unordered, ordered, item
 *   <dl>, <dt>, <dd>                definition list — term, definition
 *   <blockquote>, <footer>          quotation and its attribution
 *   <pre>, <code>, <kbd>, <samp>    code — block, inline, keyboard input, output
 *   <figure>, <figcaption>          media with a caption
 *   <img>, <video>, <canvas>, <svg>  media — raster, video, canvas, vector
 *   <table>, <caption>, <th>, <td>   table — with caption, header, cell
 *   <tfoot>                         table footer
 *   <hr>                            thematic break
 *   <a>                             link — the one piece of prose that is also a control
 *   <strong>, <b>                   bold
 *   <small>                         side comment
 *   <sub>, <sup>                    subscript, superscript
 *   <abbr[title]>                   abbreviation with expansion
 *   <mark>                          highlighted text
 *   <ins>, <del>                     insertion, deletion
 *   <iframe>, <embed>, <object>     embedded content
 *   table.striped                  alternating row backgrounds
 *
 * Two kinds of value appear here:
 *
 *   spent bindings  The CSS names a scale step it consumes — `var(--spacing-2)`,
 *                   `var(--radius-md)`, `var(--font-weight-bold)`. No token is
 *                   minted, because the author of the CSS has no choice to
 *                   express. A theme moves the prose by moving the scale.
 *
 *   character       None. Every value here is a scale step. A theme that wants
 *                   denser prose changes `spacing`, and every block moves with
 *                   it. Vertical rhythm is expressed in `em`, not `rem`, so it
 *                   tracks the element's own size — an `h1` and a `p` sit on the
 *                   same rhythm scaled to their type.
 *
 * States:
 *   :hover           links only — thicker underline
 *   :active          not used
 *   :focus-visible   links only — focus ring
 *   :disabled        not used — content is not interactive
 *   aria-current     not used — no navigation state in content
 *
 * Motion:
 *   No transitions or keyframes. Content is static — it does not move, so there
 *   is nothing to animate and no reduced-motion block.
 *
 * ARIA + AT:
 *   A screen reader navigates content by structure: headings are landmarks,
 *   lists are announced with their item count, tables are announced with their
 *   caption and header associations. The `abbr[title]` expansion is read in full.
 *   `mark` is announced as highlighted. `ins` and `del` are announced as
 *   insertions and deletions. Links are announced with their href. Images need
 *   `alt` text to be in the a11y tree — the CSS does not create it, but the
 *   radius and border treatment assume it is there.
 */

/* ---------- rhythm ---------- */

/* Headings, lists and figures share one vertical beat. Proportional to the
   element's type size, so the rhythm holds at every scale. */
h1,
h2,
h3,
h4,
h5,
h6,
p,
ul,
ol,
dl,
blockquote,
pre,
table,
figure {

  /* font-family: heading → body → sans fallback chain is composite, not a single scale step. */
  font-family: var(--font-family-heading, var(--font-family-body,
    var(--font-family-sans)));

  line-height: 1.2;
  letter-spacing: -0.02em;
}

h2 {
  /* font-family: heading → body → sans fallback chain is composite, not a single scale step. */
  font-family: var(--font-family-heading, var(--font-family-body,
    var(--font-family-sans)));
  font-weight:var(--font-weight-semibold);font-size:var(--font-size-2xl);
  line-height: 1.3;
  letter-spacing: -0.01em;
}

h3 {
  /* font-family: heading → body → sans fallback chain is composite, not a single scale step. */
  font-family: var(--font-family-heading, var(--font-family-body,
    var(--font-family-sans)));
  font-weight:var(--font-weight-semibold);font-size:var(--font-size-xl);
  line-height: 1.4;
}

h4 {
  /* font-family: heading → body → sans fallback chain is composite, not a single scale step. */
  font-family: var(--font-family-heading, var(--font-family-body,
    var(--font-family-sans)));
  font-weight:var(--font-weight-semibold);font-size:var(--font-size-lg);
  line-height: 1.4;
}

h5,
h6 {
  /* font-family: heading → body → sans fallback chain is composite, not a single scale step. */
  font-family: var(--font-family-heading, var(--font-family-body,
    var(--font-family-sans)));
  font-weight:var(--font-weight-semibold);font-size:var(--font-size-md);
  line-height: 1.5;
}

/* The gap above a heading is what makes it read as a heading; the gap below is
   what makes it read as attached to what follows. */
h1,
h2,
h3,
h4,
h5,
h6 {
  margin-block-start: var(--spacing-4);
}

h1 {
  margin-block-end: var(--spacing-4);
}

/* ---------- document ---------- */

/* The page itself. A theme owns these four values and nothing else about the
   document, which is why they are the base of the whole layer. */
body {
  /* font-family: body → sans fallback chain is composite, not a single scale step. */
  font-family: var(--font-family-body, var(--font-family-sans));
  font-size:var(--font-size-md);
  line-height: 1.5;
  background-color:var(--color-surface);color:var(--color-text);
  margin: 0;
}

/* ---------- link ---------- */

/* A link is the one piece of prose that is also a control, so it carries the
   brand color and a visible underline by default. Underlining prose links is
   the accessible default; the color alone is not enough to find one. */
a {
  color:var(--color-link);
  text-decoration: underline;
  text-underline-offset: 0.2em;
}

a:hover {
  text-decoration-thickness: 2;
}

a:focus-visible {
  outline: var(--focus-width) solid var(--color-focus-ring);
  outline-offset: var(--focus-offset);
  border-radius:var(--radius-sm);
}

/* ---------- inline ---------- */

strong,
b {
  font-weight:var(--font-weight-bold);
}

small {
  font-size:var(--font-size-xs);color:var(--color-text-muted);
}

sub,
sup {
  font-size:var(--font-size-xs);
}

abbr[title] {
  text-decoration: underline dotted;
  cursor: help;
}

mark {
  padding: 0 calc(var(--spacing-1) / 2);
  background-color:var(--color-accent);color:var(--color-surface);
}

ins {
  text-decoration: underline;
  color:var(--color-semantic-success);
}

del {
  text-decoration: line-through;
  color:var(--color-semantic-error);
}

/* ---------- lists ---------- */

ul,
ol {
  padding-inline-start: var(--spacing-4);
}

li + li {
  margin-block-start: var(--spacing-1);
}

dt {
  font-weight:var(--font-weight-semibold);
}

dd {
  margin-inline-start: var(--spacing-4);
}

/* ---------- quote ---------- */

blockquote {
  padding: var(--spacing-2) var(--spacing-4);
  border-inline-start: var(--border-width) solid var(--color-border);
  color:var(--color-text-muted);
}

blockquote footer {
  margin-block-start: var(--spacing-1);
  font-size:var(--font-size-sm);
}

/* ---------- rule ---------- */

hr {
  height: 0;
  margin-block: var(--spacing-4);
  border: 0;
  border-block-start: var(--border-width) solid var(--color-border);
}

/* ---------- code ---------- */

code,
kbd,
samp,
pre {
  /* font-family: mono → system fallback chain is composite, not a single scale step. */
  font-family: var(--font-family-mono, ui-monospace, SFMono-Regular, Menlo,
    Consolas, monospace);
  font-size:var(--font-size-sm);
}

code {
  padding: calc(var(--spacing-1) / 2) var(--spacing-1);
  background-color:var(--color-surface);color:var(--color-text);border-radius:var(--radius-sm);
}

pre {
  padding: var(--spacing-2) var(--spacing-4);
  background-color:var(--color-surface);color:var(--color-text);border-radius:var(--radius-md);
  line-height: 1.5;
  overflow-x: auto;
}

/* A code block is not a stack of inline chips. */
pre code {
  padding: 0;
  background-color: transparent;
}

kbd {
  padding: calc(var(--spacing-1) / 2) var(--spacing-1);
  border: var(--border-width) solid var(--color-border);
  border-block-end-width: calc(var(--border-width) * 2);
  background-color:var(--color-surface-raised);color:var(--color-text);font-size:var(--font-size-xs);border-radius:var(--radius-sm);
  white-space: nowrap;
}

/* ---------- figure ---------- */

figure {
  margin-inline: 0;
}

figcaption {
  margin-block-start: var(--spacing-1);
  text-align:center;font-size:var(--font-size-sm);color:var(--color-text-muted);
}

/* ---------- media ---------- */

img,
video,
canvas,
svg {
  display: block;
  max-width: 100%;
  height: auto;
}

img,
video {
  border-radius:var(--radius-md);
}

/* ---------- table ---------- */

table {
  width: 100%;
  border-collapse: collapse;
  font-size:var(--font-size-sm);
}

caption {
  padding-block-end: var(--spacing-1);
  text-align:left;color:var(--color-text-muted);
}

th,
td {
  padding: var(--spacing-1) var(--spacing-2);
  border-block-end: var(--border-width) solid var(--color-border);
  text-align: left;
}

th {
  font-weight:var(--font-weight-semibold);
}

tfoot td {
  border-block-start: var(--border-width) solid var(--color-border);
  border-block-end: 0;
  font-weight:var(--font-weight-semibold);
}

   expresses "every other row". */
table.striped tbody tr:nth-of-type(odd) {
  background-color:var(--color-surface-raised);
}

/* ---------- embedded ---------- */

iframe,
embed,
object {
  display: block;
  max-width: 100%;
  border: var(--border-width) solid var(--color-border);
  border-radius:var(--radius-md);
}


/*
 * Semantic disclosure and dialog.
 *
 * Two components, one reason they belong together: the platform provides both.
 * `<details>` is a disclosure widget and `<dialog>` is a modal, and neither
 * needs JavaScript to be usable or accessible. That is the entire argument for
 * styling them here rather than shipping a headless component library — the
 * behaviour, the focus handling and the semantics are already in the browser.
 *
 * Markup contract:
 *   <details>                       disclosure widget — closed by default
 *   <details open>                  disclosure widget — open
 *   <details> > <summary>           the label and toggle, always visible
 *   <details> > *:not(summary)      the collapsible body
 *   <dialog>                        modal — hidden by default
 *   <dialog open>                   modal — visible, with backdrop
 *   dialog::backdrop                the veil behind the modal
 *
 * Two kinds of value appear here:
 *
 *   spent bindings  The CSS names a scale step it consumes — `var(--spacing-4)`,
 *                   `var(--spacing-2)`, `var(--motion-duration-fast)`. No token is
 *                   minted, because the author of the CSS has no choice to
 *                   express. A theme moves the disclosure by moving the scale.
 *
 *   character       None. The one value a theme states is how long the chevron
 *                   takes to turn, and even that spends `motion.duration.fast`;
 *                   a theme with no motion preference gets it from the
 *                   reduced-motion block below rather than from a token.
 *
 * States:
 *   :hover           summary only — surface background
 *   :active          not used — no pressed state
 *   :focus-visible   summary only — focus ring
 *   :disabled        not used — disclosure has no disabled state
 *   [open]           the open state — chevron rotates, body is visible
 *
 * Motion:
 *   The chevron rotates on open, spending `motion.duration.fast`. The dialog
 *   entrance is a scale-and-fade from just below full size via `@starting-style`
 *   and `dialog-in` from `@spin/animation`; the backdrop fades in via `backdrop-in`.
 *   `allow-discrete` lets the transition run on the way out too. The
 *   reduced-motion block below turns all of it off.
 *
 * ARIA + AT:
 *   A screen reader announces a disclosure as a button that expands or collapses
 *   a region. The `open` state is announced. A dialog is announced as a modal
 *   dialog, and focus is trapped inside it while it is open. The backdrop is
 *   presentational — it must stay out of the a11y tree. The dialog's own heading
 *   and body share the page rhythm, so a dialog reads as a page fragment.
 */

/* ---------- disclosure ---------- */

details {
  border-width:1px;background-color:var(--color-surface-raised);border-color:var(--color-border);margin-top:var(--spacing-2);margin-bottom:var(--spacing-2);border-radius:var(--radius-md);
}
